<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>


  <script
    src="https://unpkg.com/html5-qrcode">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }


    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
    }


    h1 {
      text-align: center;
      margin: 6px 0 12px;
      font-size: 24px;
    }


    .camera-box {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }


    .camera-title {
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }


    .camera-info {
      text-align: center;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
    }


    select {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }


    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .primary {
      background: #222;
      color: white;
    }


    .secondary {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }


    .confirm {
      display: none;
      background: #176b2c;
      color: white;
    }


    /* =================================================
       MALÁ ČTVERCOVÁ KAMERA
       ================================================= */

    .reader-wrap {
      width: min(82vw, 310px);
      height: min(82vw, 310px);
      max-width: 310px;
      max-height: 310px;
      margin: 12px auto 0;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
    }


    #reader {
      width: 100%;
      height: 100%;
      background: #111;
    }


    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }


    /* =================================================
       ZPRACOVÁVÁM
       ================================================= */

    #scanStatus {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #fff3cd;
      border: 2px solid #e0b400;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }


    /* =================================================
       VÝSLEDEK POD KAMEROU
       ================================================= */

    #scanResultFrame {
      width: 100%;
      min-height: 125px;
      border: 0;
      margin-top: 8px;
      display: block;
      background: transparent;
    }


    /* =================================================
       PANEL
       ================================================= */

    #panelContainer {
      display: none;
      margin-top: 8px;
    }


    #panelFrame {
      width: 100%;
      min-height: 1050px;
      border: none;
      display: block;
      background: #f3f3f3;
    }


    /* =================================================
       ZMĚNA KAMERY ÚPLNĚ DOLE
       ================================================= */

    #bottomCameraControls {
      display: none;
      margin-top: 14px;
      padding-bottom: 30px;
    }


    .bottom-note {
      text-align: center;
      color: #777;
      font-size: 13px;
    }


    /* =================================================
       SKRYTÝ FORM
       ================================================= */

    #scanForm {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka
  </h1>


  <div class="camera-box">


    <div class="camera-title">
      📷 QR skener
    </div>


    <!-- ======================================= -->
    <!-- TEST KAMERY -->
    <!-- ======================================= -->

    <div id="setupControls">


      <div class="camera-info">

        Vyber kameru, která dobře ostří
        na malý QR kód.

        <br><br>

        Nejdřív naskenuj jednu kartičku nanečisto.
        Test se do docházky nezapisuje.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        class="primary"
        onclick="startCameraTest()">

        📷 Otestovat vybranou kameru

      </button>

    </div>


    <!-- ======================================= -->
    <!-- KAMERA -->
    <!-- ======================================= -->

    <div class="reader-wrap">

      <div id="reader">
      </div>

    </div>


    <!-- ======================================= -->
    <!-- STAV -->
    <!-- ======================================= -->

    <div id="scanStatus">

      ⏳ Zpracovávám...

    </div>


    <!-- ======================================= -->
    <!-- VÝSLEDEK -->
    <!-- ======================================= -->

    <iframe
      id="scanResultFrame"
      name="scanResultFrame"
      srcdoc="
        <html>
        <body style='font-family:Arial;text-align:center;color:#777;padding:25px 5px;margin:0;'>
        Čekám na první kartičku.
        </body>
        </html>
      ">
    </iframe>


    <button
      id="confirmCameraButton"
      class="confirm"
      onclick="confirmCamera()">

      ✅ Tato kamera funguje – spustit docházku

    </button>


  </div>


  <!-- ========================================= -->
  <!-- PANEL -->
  <!-- ========================================= -->

  <div id="panelContainer">

    <iframe
      id="panelFrame"
      src="">
    </iframe>

  </div>


  <!-- ========================================= -->
  <!-- ZMĚNA KAMERY DOLE -->
  <!-- ========================================= -->

  <div id="bottomCameraControls">


    <div class="bottom-note">

      Tuto volbu potřebuješ jen pokud
      kamera špatně ostří.

    </div>


    <button
      class="secondary"
      onclick="changeCamera()">

      🔄 Změnit / znovu otestovat kameru

    </button>

  </div>


  <!-- ========================================= -->
  <!-- SKRYTÝ POST FORM -->
  <!-- ========================================= -->

  <form
    id="scanForm"
    method="POST"
    target="scanResultFrame">

    <input
      type="hidden"
      name="action"
      value="scanPage">

    <input
      type="hidden"
      id="scanCode"
      name="code">

  </form>


</div>


<script>


// =====================================================
// SEM VLOŽ SVOU APPS SCRIPT WEB APP URL
//
// BEZ ?page=panel
// =====================================================

const WEBAPP_URL =
  'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec';


// =====================================================
// PANEL
// =====================================================

const PANEL_URL =
  WEBAPP_URL +
  '?page=panel';


// =====================================================
// PROMĚNNÉ
// =====================================================

let scanner =
  null;


let scanning =
  false;


let selectedCameraId =
  '';


let testMode =
  true;


let cameraTestSuccessful =
  false;


let attendanceMode =
  false;


let scannerBusy =
  false;


let pendingScan =
  false;


let lastCode =
  '';


let lastScanTime =
  0;


// =====================================================
// NAČTENÍ KAMER
// =====================================================

async function loadCameras() {

  const select =
    document
      .getElementById(
        'cameraSelect'
      );


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    select.innerHTML =
      '';


    if (
      !cameras ||
      cameras.length === 0
    ) {

      alert(
        'Nebyla nalezena žádná kamera.'
      );


      return;

    }


    cameras.forEach(

      function(camera, index) {

        const option =
          document
            .createElement(
              'option'
            );


        option.value =
          camera.id;


        option.textContent =
          camera.label ||
          (
            'Kamera ' +
            (index + 1)
          );


        select.appendChild(
          option
        );

      }

    );


  } catch (error) {

    alert(
      'Kamery se nepodařilo načíst: ' +
      error
    );

  }

}


// =====================================================
// TEST KAMERY
// =====================================================

async function startCameraTest() {

  const select =
    document
      .getElementById(
        'cameraSelect'
      );


  selectedCameraId =
    select.value;


  if (!selectedCameraId) {

    return;

  }


  await stopScanner();


  testMode =
    true;


  attendanceMode =
    false;


  cameraTestSuccessful =
    false;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    await scanner.start(

      {
        deviceId: {
          exact:
            selectedCameraId
        }
      },

      {

        fps:
          15,


        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(

                Math.min(
                  width,
                  height
                ) * 0.80

              );


            return {

              width:
                size,

              height:
                size

            };

          },


        videoConstraints: {

          deviceId: {
            exact:
              selectedCameraId
          },

          width: {
            ideal:
              1920
          },

          height: {
            ideal:
              1080
          },

          frameRate: {
            ideal:
              30
          }

        }

      },

      onQrRead,

      function() {

        // Nepřečtené snímky ignorujeme.

      }

    );


    scanning =
      true;


  } catch (error) {

    scanning =
      false;


    alert(
      'Kameru se nepodařilo spustit: ' +
      error
    );

  }

}


// =====================================================
// QR PŘEČTEN
// =====================================================

function onQrRead(decodedText) {

  const code =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  // =================================================
  // STEJNÝ KÓD NĚKOLIK SEKUND IGNORUJEME
  // =================================================

  if (
    code === lastCode &&
    now - lastScanTime < 5000
  ) {

    return;

  }


  lastCode =
    code;


  lastScanTime =
    now;


  // =================================================
  // TEST KAMERY
  // =================================================

  if (
    testMode
  ) {

    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;


      const frame =
        document
          .getElementById(
            'scanResultFrame'
          );


      frame.srcdoc =

        '<html>' +

        '<body style="' +
        'font-family:Arial;' +
        'text-align:center;' +
        'margin:0;' +
        'padding:18px 5px;' +
        'background:#dff3df;' +
        'border:2px solid #70b970;' +
        'border-radius:14px;' +
        '">' +

        '<div style="font-size:23px;font-weight:bold;">' +

        '✅ Kamera funguje' +

        '</div>' +

        '<div style="margin-top:6px;">' +

        'Přečteno: ' +
        code +

        '</div>' +

        '</body>' +

        '</html>';


      document
        .getElementById(
          'confirmCameraButton'
        )
        .style.display =
          'block';

    }


    return;

  }


  // =================================================
  // OSTRÁ DOCHÁZKA
  // =================================================

  if (
    !attendanceMode ||
    scannerBusy
  ) {

    return;

  }


  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    return;

  }


  submitQr(
    code
  );

}


// =====================================================
// POTVRDIT KAMERU
// =====================================================

function confirmCamera() {

  if (
    !cameraTestSuccessful
  ) {

    return;

  }


  if (
    WEBAPP_URL.includes(
      'SEM_VLOZ'
    )
  ) {

    alert(
      'Nejdřív vlož svoji WEBAPP_URL do index.html.'
    );

    return;

  }


  // =================================================
  // KAMERU NEVYPÍNÁME.
  // STEJNÁ FUNKČNÍ KAMERA POKRAČUJE DÁL.
  // =================================================

  testMode =
    false;


  attendanceMode =
    true;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'bottomCameraControls'
    )
    .style.display =
      'block';


  refreshPanel();


  const frame =
    document
      .getElementById(
        'scanResultFrame'
      );


  frame.srcdoc =

    '<html>' +

    '<body style="' +
    'font-family:Arial;' +
    'text-align:center;' +
    'margin:0;' +
    'padding:25px 5px;' +
    'color:#176b2c;' +
    'font-weight:bold;' +
    'font-size:19px;' +
    '">' +

    '🟢 Připraveno – naskenuj první kartičku' +

    '</body>' +

    '</html>';

}


// =====================================================
// ODESLÁNÍ QR
// =====================================================

function submitQr(code) {

  scannerBusy =
    true;


  pendingScan =
    true;


  document
    .getElementById(
      'scanStatus'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'scanStatus'
    )
    .textContent =
      '⏳ Zpracovávám ' +
      code +
      '...';


  document
    .getElementById(
      'scanCode'
    )
    .value =
      code;


  const form =
    document
      .getElementById(
        'scanForm'
      );


  form.action =
    WEBAPP_URL;


  form.submit();

}


// =====================================================
// VÝSLEDEK SE NAČETL
// =====================================================

document
  .getElementById(
    'scanResultFrame'
  )
  .addEventListener(

    'load',

    function() {

      if (
        !pendingScan
      ) {

        return;

      }


      pendingScan =
        false;


      scannerBusy =
        false;


      lastCode =
        '';


      lastScanTime =
        Date.now();


      document
        .getElementById(
          'scanStatus'
        )
        .style.display =
          'none';


      // =================================================
      // AUTOMATICKY OBNOVÍME PANEL
      // =================================================

      refreshPanel();

    }

  );


// =====================================================
// OBNOVIT PANEL
// =====================================================

function refreshPanel() {

  const frame =
    document
      .getElementById(
        'panelFrame'
      );


  frame.src =

    PANEL_URL +

    '&refresh=' +

    Date.now();

}


// =====================================================
// ZMĚNA KAMERY
// =====================================================

async function changeCamera() {

  attendanceMode =
    false;


  testMode =
    true;


  cameraTestSuccessful =
    false;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  await stopScanner();


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  window.scrollTo({

    top:
      0,

    behavior:
      'smooth'

  });

}


// =====================================================
// ZASTAVIT KAMERU
// =====================================================

async function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    await scanner.stop();

  } catch (error) {

    // Ignorujeme.

  }


  try {

    scanner.clear();

  } catch (error) {

    // Ignorujeme.

  }


  scanning =
    false;

}


// =====================================================
// START
// =====================================================

loadCameras();

</script>


</body>

</html>
