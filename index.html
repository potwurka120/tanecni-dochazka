<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>


  <style>

    code-outline-highlight {
  stroke: #22c55e !important;
}

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f3f3;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 6px 0 4px;
    }


    /* LEKCE */

    #eventContainer {
      margin-bottom: 8px;
    }

    #eventFrame {
      display: block;
      width: 100%;
      height: 44px;
      border: 0;
      background: transparent;
      overflow: hidden;
    }


    /* KAMERA */

    .camera-box {
      background: white;
      border-radius: 16px;
      padding: 12px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .camera-info {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }

    button,
    .link-button {
      display: block;
      width: 100%;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    button {
      border: none;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary,
    .home-button {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    #confirmCameraButton {
      display: none;
      background: #176b2c;
      color: white;
      font-size: 18px;
      padding: 16px;
    }

    #confirmCameraButton.visible {
      display: block;
    }


    /* VIDEO */

    .video-box {
      position: relative;
      width: min(86vw, 330px);
      max-width: 330px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
    }

    #qr-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* TEST KAMERY */

    #cameraMessage {
      margin-top: 10px;
      padding: 12px;
      border-radius: 11px;
      background: #f5f5f5;
      text-align: center;
    }

    .success {
      background: #dff3df !important;
      border: 2px solid #70b970;
    }

    .warning {
      background: #fff3cd !important;
      border: 2px solid #e0b400;
    }

    .error {
      background: #ffe5e5 !important;
      border: 2px solid #d66;
    }

    .big-code {
      display: block;
      font-size: 32px;
      font-weight: bold;
      margin-top: 6px;
    }


    /* ZPRACOVÁNÍ */

    #scanStatus {
      display: none;
      margin-top: 10px;
      padding: 11px;
      border-radius: 11px;
      background: #fff3cd;
      border: 2px solid #e0b400;
      text-align: center;
      font-weight: bold;
    }


    /* POSLEDNÍ NAČTENÍ */

    .result-box {
      margin-top: 10px;
      background: white;
      border-radius: 16px;
      overflow: hidden;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .result-label {
      padding: 11px 13px 0;
      font-size: 12px;
      color: #777;
      font-weight: bold;
    }

    #scanResultFrame {
      display: block;
      width: 100%;
      height: 220px;
      border: 0;
      overflow: hidden;
    }


    /* RUČNÍ ZÁPIS */

    #manualArea {
      display: none;
      margin-top: 10px;
    }

    #manualToggle {
      background: #222;
      color: white;
    }

    #manualPanel {
      display: none;
      margin-top: 8px;
    }

    #manualFrame {
      display: block;
      width: 100%;

      /*
       * Pevná kompaktní výška.
       * Výsledky se posouvají uvnitř iframe.
       */
      height: 355px;

      border: 0;
      background: transparent;
      overflow: hidden;
    }


    /* HISTORIE */

    #historyBox {
      display: none;
      margin-top: 10px;
      padding: 15px;
      background: white;
      border-radius: 16px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .history-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .history-note {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .history-item {
      display: grid;
      grid-template-columns: 48px 52px 1fr;
      gap: 6px;
      align-items: center;
      padding: 10px 2px;
      border-bottom: 1px solid #eee;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-time {
      color: #777;
      font-size: 13px;
    }

    .history-card {
      font-weight: bold;
    }

    .history-name {
      font-size: 16px;
      font-weight: bold;
    }

    .history-status {
      grid-column: 3;
      font-size: 12px;
      margin-top: -3px;
    }

    .history-success {
      color: #176b2c;
    }

    .history-warning {
      color: #8a6900;
    }

    .history-error {
      color: #b22;
    }

    .history-manual {
      color: #375a9e;
    }

    .history-hidden {
      display: none;
    }


    #bottomControls {
      display: none;
      margin-top: 12px;
      padding-bottom: 30px;
    }

    #scanForm,
    #overviewForm,
    #overviewFrame {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka
  </h1>


  <div id="eventContainer">

    <iframe
      id="eventFrame"
      scrolling="no">
    </iframe>

  </div>


  <div class="camera-box">


    <div id="setupControls">

      <div class="camera-info">

        Vyber kameru a naskenuj jednu kartičku nanečisto.

        <br>

        Test se do docházky nezapíše.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        id="testCameraButton"
        class="primary">

        📷 Otestovat vybranou kameru

      </button>

    </div>


    <div class="video-box">

      <video
        id="qr-video"
        playsinline
        muted>
      </video>

    </div>


    <div id="cameraMessage">
      Čekám na výběr kamery.
    </div>


    <button id="confirmCameraButton">
      ✅ Kamera funguje – spustit docházku
    </button>


    <div id="scanStatus">
      ⏳ Zpracovávám...
    </div>

  </div>


  <!-- POSLEDNÍ NAČTENÍ -->

  <div class="result-box">

    <div class="result-label">
      POSLEDNÍ NAČTENÍ
    </div>


    <iframe
      id="scanResultFrame"
      name="scanResultFrame"
      scrolling="no"
      srcdoc="
        <html>
        <body style='
          margin:0;
          padding:45px 8px;
          overflow:hidden;
          font-family:Arial;
          text-align:center;
          color:#777;
        '>
          Po spuštění docházky se zde zobrazí jméno.
        </body>
        </html>
      ">
    </iframe>

  </div>


  <!-- RUČNÍ ZÁPIS -->

  <div id="manualArea">

    <button
      id="manualToggle"
      onclick="toggleManualPanel()">

      ✍️ Nemám kartičku – ruční načtení

    </button>


    <div id="manualPanel">

      <iframe
        id="manualFrame"
        scrolling="no">
      </iframe>

    </div>

  </div>


  <!-- HISTORIE -->

  <div id="historyBox">

    <div class="history-title">
      📋 Historie v tomto telefonu
    </div>


    <div class="history-note">
      Obsahuje QR i ruční zápisy z tohoto telefonu.
    </div>


    <div id="historyList"></div>


    <button
      id="olderHistoryButton"
      class="secondary"
      onclick="toggleHistory()"
      style="display:none;">

      Zobrazit starší ▾

    </button>


    <button
      class="secondary"
      onclick="clearScanHistory()">

      🧹 Vymazat historii v telefonu

    </button>

  </div>


  <div id="bottomControls">

    <a
      id="homeLink"
      class="link-button home-button">

      ← Přejít na hlavní stránku

    </a>


    <button
      id="changeCameraButton"
      class="secondary">

      📷 Změnit výběr kamery

    </button>

  </div>


  <form
    id="scanForm"
    method="POST"
    target="scanResultFrame">

    <input
      type="hidden"
      name="action"
      value="scan">

    <input
      type="hidden"
      id="scanCode"
      name="code">

  </form>


  <iframe
    id="overviewFrame"
    name="overviewFrame">
  </iframe>


  <form
    id="overviewForm"
    method="POST"
    target="overviewFrame">

    <input
      type="hidden"
      name="action"
      value="refreshOverviews">

  </form>


</div>


<script type="module">


import QrScanner
  from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


// =====================================================
// DOPLŇ SVOU APPS SCRIPT /exec URL
// =====================================================

const WEBAPP_URL =
  'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec';


const EVENT_PANEL_URL =
  WEBAPP_URL +
  '?page=event';


const MANUAL_PANEL_URL =
  WEBAPP_URL +
  '?page=door';


const HOME_URL =
  WEBAPP_URL;


// =====================================================
// HISTORIE
// =====================================================

const HISTORY_KEY =
  'danceAttendanceScanHistory';


const MAX_HISTORY =
  50;


let scanHistory =
  [];


let historyExpanded =
  false;


const processedMessages =
  new Set();


// =====================================================
// ELEMENTY
// =====================================================

const video =
  document.getElementById(
    'qr-video'
  );


const cameraSelect =
  document.getElementById(
    'cameraSelect'
  );


const cameraMessage =
  document.getElementById(
    'cameraMessage'
  );


const testCameraButton =
  document.getElementById(
    'testCameraButton'
  );


const confirmCameraButton =
  document.getElementById(
    'confirmCameraButton'
  );


const changeCameraButton =
  document.getElementById(
    'changeCameraButton'
  );


const resultFrame =
  document.getElementById(
    'scanResultFrame'
  );


const eventFrame =
  document.getElementById(
    'eventFrame'
  );


const manualFrame =
  document.getElementById(
    'manualFrame'
  );


document
  .getElementById(
    'homeLink'
  )
  .href =
    HOME_URL;


eventFrame.src =
  EVENT_PANEL_URL;


// =====================================================
// STAV
// =====================================================

let selectedCameraId =
  '';

let testMode =
  true;

let attendanceMode =
  false;

let cameraTestSuccessful =
  false;

let scannerBusy =
  false;

let pendingScan =
  false;

let lastCode =
  '';

let lastScanTime =
  0;

let overviewRefreshTimer =
  null;


// =====================================================
// RUČNÍ PANEL
// =====================================================

window.toggleManualPanel =
  function() {

    const panel =
      document.getElementById(
        'manualPanel'
      );


    const button =
      document.getElementById(
        'manualToggle'
      );


    const opening =
      panel.style.display !==
      'block';


    if (
      opening
    ) {

      panel.style.display =
        'block';


      button.textContent =
        '✖ Zavřít ruční načtení';


      /*
       * Iframe načteme až při prvním otevření.
       */

      if (
        !manualFrame.src
      ) {

        manualFrame.src =
          MANUAL_PANEL_URL;
      }

    } else {

      panel.style.display =
        'none';


      button.textContent =
        '✍️ Nemám kartičku – ruční načtení';
    }
  };


// =====================================================
// AUDIO
// =====================================================

let audioContext =
  null;


function prepareAudio() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {
      return;
    }


    if (!audioContext) {

      audioContext =
        new AudioContextClass();
    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();
    }

  } catch (error) {}
}


function beep(
  frequency,
  duration
) {

  try {

    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      frequency;


    const now =
      audioContext.currentTime;


    gain.gain.setValueAtTime(
      0.15,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + duration
    );


    oscillator.start(
      now
    );


    oscillator.stop(
      now + duration
    );

  } catch (error) {}
}


// =====================================================
// QR SCANNER
// =====================================================

const scanner =
  new QrScanner(

    video,

    function(result) {

      processQr(
        result
      );
    },

    {
      returnDetailedScanResult:
        true,

      highlightScanRegion:
        true,

      highlightCodeOutline:
        true,

      maxScansPerSecond:
        12,

      preferredCamera:
        'environment'
    }

  );


// =====================================================
// HISTORIE
// =====================================================

function loadScanHistory() {

  try {

    const saved =
      sessionStorage.getItem(
        HISTORY_KEY
      );


    if (saved) {

      const parsed =
        JSON.parse(
          saved
        );


      if (
        Array.isArray(
          parsed
        )
      ) {

        scanHistory =
          parsed;
      }
    }

  } catch (error) {

    scanHistory =
      [];
  }


  renderScanHistory();
}


function saveScanHistory() {

  try {

    sessionStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        scanHistory
      )
    );

  } catch (error) {}
}


function addScanToHistory(
  data
) {

  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      'cs-CZ',
      {
        hour: '2-digit',
        minute: '2-digit'
      }
    );


  let statusText =
    'Nelze zapsat';


  let statusType =
    'error';


  if (
    data.method ===
      'Ručně' &&
    data.success &&
    data.resultType ===
      'new'
  ) {

    statusText =
      'Zapsán/a ručně';

    statusType =
      'manual';

  } else if (
    data.success &&
    data.resultType ===
      'new'
  ) {

    statusText =
      'Zapsán/a';

    statusType =
      'success';

  } else if (
    data.success &&
    data.resultType ===
      'duplicate'
  ) {

    statusText =
      'Už byl/a zapsán/a';

    statusType =
      'warning';

  } else if (
    data.resultType ===
      'inactiveCard'
  ) {

    statusText =
      'Ukončená kartička';

  } else if (
    data.resultType ===
      'unknown'
  ) {

    statusText =
      'Neznámá kartička';

  } else if (
    data.resultType ===
      'busy'
  ) {

    statusText =
      'Nezapsáno – zkus znovu';

    statusType =
      'warning';
  }


  scanHistory.unshift({

    time:
      time,

    cardId:
      data.cardId ||
      '?',

    name:
      data.name ||
      'Neznámý účastník',

    status:
      statusText,

    statusType:
      statusType,

    event:
      data.event ||
      '',

    method:
      data.method ||
      'QR'

  });


  scanHistory =
    scanHistory.slice(
      0,
      MAX_HISTORY
    );


  saveScanHistory();


  renderScanHistory();
}


function renderScanHistory() {

  const container =
    document.getElementById(
      'historyList'
    );


  const button =
    document.getElementById(
      'olderHistoryButton'
    );


  container.innerHTML =
    '';


  if (
    !scanHistory.length
  ) {

    container.innerHTML =
      '<div style="color:#777;padding:8px 0;">Zatím žádný zápis.</div>';


    button.style.display =
      'none';


    return;
  }


  scanHistory.forEach(

    function(
      item,
      index
    ) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'history-item';


      if (
        index >= 5 &&
        !historyExpanded
      ) {

        div.classList.add(
          'history-hidden'
        );
      }


      const time =
        document.createElement(
          'div'
        );


      time.className =
        'history-time';


      time.textContent =
        item.time;


      const card =
        document.createElement(
          'div'
        );


      card.className =
        'history-card';


      card.textContent =
        item.cardId;


      const name =
        document.createElement(
          'div'
        );


      name.className =
        'history-name';


      name.textContent =
        item.name;


      const status =
        document.createElement(
          'div'
        );


      status.className =
        'history-status history-' +
        item.statusType;


      status.textContent =
        item.status;


      div.appendChild(
        time
      );


      div.appendChild(
        card
      );


      div.appendChild(
        name
      );


      div.appendChild(
        status
      );


      container.appendChild(
        div
      );
    }
  );


  button.style.display =
    scanHistory.length > 5
      ? 'block'
      : 'none';


  button.textContent =
    historyExpanded
      ? 'Skrýt starší ▴'
      : 'Zobrazit starší ▾';
}


window.toggleHistory =
  function() {

    historyExpanded =
      !historyExpanded;


    renderScanHistory();
  };


window.clearScanHistory =
  function() {

    if (
      !confirm(
        'Opravdu vymazat historii v tomto telefonu? Docházka v tabulce se tím nezmění.'
      )
    ) {

      return;
    }


    scanHistory =
      [];


    historyExpanded =
      false;


    saveScanHistory();


    renderScanHistory();
  };


// =====================================================
// RUČNÍ VÝSLEDEK DO POSLEDNÍHO NAČTENÍ
// =====================================================

function showManualAsLastRead(
  data
) {

  let background =
    '#ffe5e5';


  let border =
    '#d66';


  let icon =
    '❌';


  let detail =
    'Zápis se nepodařil';


  if (
    data.success &&
    data.resultType ===
      'new'
  ) {

    background =
      '#dff3df';

    border =
      '#70b970';

    icon =
      '✅';

    detail =
      'Zapsán/a ručně';

  } else if (
    data.success &&
    data.resultType ===
      'duplicate'
  ) {

    background =
      '#fff3cd';

    border =
      '#e0b400';

    icon =
      '⚠️';

    detail =
      'Už je v této lekci zapsán/a';
  }


  const safeName =
    escapeHtml(
      data.name ||
      ''
    );


  const safeCard =
    escapeHtml(
      data.cardId ||
      ''
    );


  resultFrame.srcdoc =

    '<!DOCTYPE html>' +

    '<html>' +

    '<body style="' +
    'margin:0;' +
    'padding:0;' +
    'overflow:hidden;' +
    'font-family:Arial,sans-serif;' +
    '">' +

    '<div style="' +
    'height:200px;' +
    'margin:5px;' +
    'display:flex;' +
    'flex-direction:column;' +
    'justify-content:center;' +
    'align-items:center;' +
    'text-align:center;' +
    'border-radius:14px;' +
    'border:2px solid ' +
    border +
    ';' +
    'background:' +
    background +
    ';' +
    '">' +

    '<div style="' +
    'font-size:27px;' +
    'font-weight:bold;' +
    '">' +

    icon +
    ' ' +
    safeName +

    '</div>' +

    (
      safeCard
        ? (
            '<div style="' +
            'margin-top:7px;' +
            'font-size:17px;' +
            'font-weight:bold;' +
            '">' +
            'Kartička ' +
            safeCard +
            '</div>'
          )
        : ''
    ) +

    '<div style="' +
    'margin-top:8px;' +
    'font-size:16px;' +
    '">' +

    detail +

    '</div>' +

    '</div>' +

    '</body>' +

    '</html>';
}


// =====================================================
// KAMERY
// =====================================================

async function loadCameras() {

  try {

    cameraMessage.style.display =
      'block';


    cameraMessage.textContent =
      '⏳ Povol kameru...';


    await scanner.start();


    const cameras =
      await QrScanner.listCameras(
        true
      );


    await scanner.pause(
      true
    );


    cameraSelect.innerHTML =
      '';


    cameras.forEach(

      function(
        camera,
        index
      ) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.id;


        option.textContent =
          (index + 1) +
          '. ' +
          (
            camera.label ||
            'Kamera'
          );


        cameraSelect.appendChild(
          option
        );
      }
    );


    const saved =
      localStorage.getItem(
        'attendanceCameraId'
      );


    if (saved) {

      const exists =
        Array.from(
          cameraSelect.options
        )
        .some(

          function(option) {

            return (
              option.value ===
              saved
            );
          }

        );


      if (exists) {

        cameraSelect.value =
          saved;
      }
    }


    cameraMessage.textContent =
      'Vyber kameru a spusť test.';


  } catch (error) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =
      '❌ Kameru se nepodařilo připravit.';
  }
}


async function startSelectedCamera() {

  prepareAudio();


  const newCameraId =
    cameraSelect.value;


  if (!newCameraId) {
    return;
  }


  selectedCameraId =
    newCameraId;


  testMode =
    true;


  attendanceMode =
    false;


  cameraTestSuccessful =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  try {

    await scanner.pause(
      true
    );


    await scanner.setCamera(
      selectedCameraId
    );


    await scanner.start();


    cameraMessage.className =
      '';


    cameraMessage.textContent =
      '📷 Naskenuj testovací kartičku.';


  } catch (error) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =
      '❌ Kameru se nepodařilo spustit.';
  }
}


// =====================================================
// QR
// =====================================================

function processQr(
  scanResult
) {

  const code =
    String(
      scanResult &&
      scanResult.data
        ? scanResult.data
        : ''
    )
      .trim()
      .toUpperCase();


  if (!code) {
    return;
  }


  const now =
    Date.now();


  if (
    code === lastCode &&
    now - lastScanTime <
      2500
  ) {

    return;
  }


  lastCode =
    code;


  lastScanTime =
    now;


  if (testMode) {

    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;


      beep(
        760,
        0.10
      );


      cameraMessage.className =
        'success';


      cameraMessage.innerHTML =
        '✅ Kamera funguje' +
        '<span class="big-code">' +
        escapeHtml(
          code
        ) +
        '</span>';


      confirmCameraButton
        .classList
        .add(
          'visible'
        );
    }


    return;
  }


  if (
    !attendanceMode ||
    scannerBusy
  ) {

    return;
  }


  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    return;
  }


  submitQr(
    code
  );
}


// =====================================================
// SPUSTIT DOCHÁZKU
// =====================================================

function confirmCamera() {

  if (

  ) {

// =====================================================
// ODESLAT QR
// =====================================================

function submitQr(
  code
) {

  scannerBusy =
    true;


  pendingScan =
    true;


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.style.display =
    'block';


  status.textContent =
    '⏳ Zpracovávám ' +
    code +
    '...';


  document
    .getElementById(
      'scanCode'
    )
    .value =
      code;


  const form =
    document.getElementById(
      'scanForm'
    );


  form.action =
    WEBAPP_URL;


  form.submit();
}


// =====================================================
// ZPRÁVY
// =====================================================

window.addEventListener(

  'message',

  function(event) {

    const data =
      event.data;


    if (
      !data ||
      typeof data !==
        'object'
    ) {
      return;
    }


    if (
      data.messageId
    ) {

      if (
        processedMessages.has(
          data.messageId
        )
      ) {
        return;
      }


      processedMessages.add(
        data.messageId
      );


      setTimeout(

        function() {

          processedMessages.delete(
            data.messageId
          );

        },

        15000
      );
    }


    if (
      data.type ===
      'attendance-result'
    ) {

      addScanToHistory(
        data
      );


      finishScan(
        data
      );


      scheduleOverviewRefresh();


      return;
    }


    if (
      data.type ===
      'manual-attendance-result'
    ) {

      /*
       * Ruční zápis přepíše starý QR výsledek.
       */

      showManualAsLastRead(
        data
      );


      addScanToHistory(
        data
      );


      /*
       * Po úspěchu panel automaticky zavřeme.
       */

      if (
        data.success &&
        data.resultType ===
          'new'
      ) {

        setTimeout(

          function() {

            document
              .getElementById(
                'manualPanel'
              )
              .style.display =
                'none';


            document
              .getElementById(
                'manualToggle'
              )
              .textContent =
                '✍️ Nemám kartičku – ruční načtení';

          },

          900
        );
      }


      scheduleOverviewRefresh();


      return;
    }


    if (
      data.type ===
      'attendance-undo-result'
    ) {

      scannerBusy =
        false;


      pendingScan =
        false;


      lastCode =
        '';


      document
        .getElementById(
          'scanStatus'
        )
        .style.display =
          'none';


      scheduleOverviewRefresh();
    }

  }

);


function finishScan(
  data
) {

  pendingScan =
    false;


  scannerBusy =
    false;


  lastCode =
    '';


  lastScanTime =
    Date.now();


  document
    .getElementById(
      'scanStatus'
    )
    .style.display =
      'none';


  if (
    data &&
    data.success &&
    data.resultType ===
      'new'
  ) {

    beep(
      920,
      0.11
    );
  }
}


// =====================================================
// OBNOVA PŘEHLEDŮ
// =====================================================

function scheduleOverviewRefresh() {

  cancelOverviewRefresh();


  overviewRefreshTimer =
    setTimeout(

      function() {

        overviewRefreshTimer =
          null;


        if (
          scannerBusy
        ) {

          scheduleOverviewRefresh();

          return;
        }


        const form =
          document.getElementById(
            'overviewForm'
          );


        form.action =
          WEBAPP_URL;


        form.submit();

      },

      7000
    );
}


function cancelOverviewRefresh() {

  if (
    overviewRefreshTimer
  ) {

    clearTimeout(
      overviewRefreshTimer
    );


    overviewRefreshTimer =
      null;
  }
}


// =====================================================
// ZMĚNA KAMERY
// =====================================================

  attendanceMode =

  testMode =

  });
}


// =====================================================
// ESCAPE
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );
}
