<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>


  <script
    src="https://unpkg.com/html5-qrcode">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f3f3f3;

      color: #222;

    }


    .container {

      max-width: 680px;

      margin: auto;

      padding: 10px;

    }


    h1 {

      text-align: center;

      margin: 6px 0 12px;

    }


    /* =========================================
       KAMERA
       ========================================= */

    .camera-box {

      background: white;

      border-radius: 16px;

      padding: 14px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    }


    .camera-title {

      font-size: 21px;

      font-weight: bold;

      text-align: center;

      margin-bottom: 7px;

    }


    .camera-info {

      text-align: center;

      color: #666;

      line-height: 1.4;

      margin-bottom: 12px;

    }


    select {

      width: 100%;

      padding: 13px;

      border-radius: 9px;

      border: 1px solid #ccc;

      background: white;

      font-size: 16px;

    }


    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      margin-top: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .primary {

      background: #222;

      color: white;

    }


    .secondary {

      background: white;

      color: #222;

      border: 1px solid #ccc;

    }


    .confirm {

      display: none;

      background: #176b2c;

      color: white;

    }


    /* =========================================
       OBRAZ KAMERY
       ========================================= */

    #reader {

      width: 100%;

      margin-top: 12px;

      border-radius: 15px;

      overflow: hidden;

      background: #111;

    }


    /* =========================================
       STAV
       ========================================= */

    #cameraResult {

      padding: 13px;

      margin-top: 10px;

      border-radius: 10px;

      text-align: center;

      background: #f5f5f5;

    }


    .success {

      background: #e1f4e1 !important;

      border: 2px solid #69aa69;

    }


    .warning {

      background: #fff3cd !important;

      border: 2px solid #e0b400;

    }


    .error {

      background: #ffe5e5 !important;

      border: 2px solid #d66;

    }


    /* =========================================
       OSTRÝ REŽIM
       ========================================= */

    #officialControls {

      display: none;

    }


    .official-label {

      text-align: center;

      padding: 10px;

      margin-top: 10px;

      border-radius: 10px;

      background: #e1f4e1;

      font-weight: bold;

    }


    /* =========================================
       PANEL
       ========================================= */

    #panelContainer {

      display: none;

      margin-top: 10px;

    }


    #panelFrame {

      width: 100%;

      min-height: 1450px;

      border: none;

      display: block;

      background: #f3f3f3;

    }


    @media (
      max-width: 450px
    ) {

      .container {
        padding: 7px;
      }


      h1 {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka
  </h1>


  <!-- ========================================= -->
  <!-- KAMERA -->
  <!-- ========================================= -->

  <div class="camera-box">


    <div class="camera-title">
      📷 Kamera
    </div>


    <!-- ======================================= -->
    <!-- TESTOVACÍ OVLÁDÁNÍ -->
    <!-- ======================================= -->

    <div id="setupControls">


      <div class="camera-info">

        Vyber kameru, která dobře ostří
        na malý QR kód.

        <br><br>

        Nejdřív naskenuj jednu kartičku
        nanečisto. Při testu se nic
        nezapisuje do docházky.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        class="primary"
        onclick="startCameraTest()">

        📷 Otestovat vybranou kameru

      </button>

    </div>


    <!-- ======================================= -->
    <!-- ŽIVÁ KAMERA -->
    <!-- ======================================= -->

    <div id="reader"></div>


    <div id="cameraResult">

      Čekám na výběr kamery.

    </div>


    <button
      id="confirmCameraButton"
      class="confirm"
      onclick="confirmCamera()">

      ✅ Tato kamera funguje – spustit docházku

    </button>


    <!-- ======================================= -->
    <!-- OSTRÉ OVLÁDÁNÍ -->
    <!-- ======================================= -->

    <div id="officialControls">


      <div class="official-label">

        🟢 Ostré skenování zapnuto

      </div>


      <button
        class="secondary"
        onclick="changeCamera()">

        🔄 Změnit / znovu otestovat kameru

      </button>

    </div>


  </div>


  <!-- ========================================= -->
  <!-- APPS SCRIPT PANEL -->
  <!-- ========================================= -->

  <div id="panelContainer">

    <iframe
      id="panelFrame"
      src="">
    </iframe>

  </div>


</div>


<script>


// =====================================================
// SEM VLOŽ ADRESU SVÉHO APPS SCRIPT PANELU
// =====================================================

const PANEL_URL =
  'SEM_VLOZ_ADRESU_PANELU';


// =====================================================
// PROMĚNNÉ
// =====================================================

let scanner =
  null;


let scanning =
  false;


let selectedCameraId =
  '';


let testMode =
  true;


let cameraTestSuccessful =
  false;


let officialBusy =
  false;


let lastCode =
  '';


let lastScanTime =
  0;


// =====================================================
// NAČTENÍ KAMER
// =====================================================

async function loadCameras() {

  const select =
    document
      .getElementById(
        'cameraSelect'
      );


  const result =
    document
      .getElementById(
        'cameraResult'
      );


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    select.innerHTML =
      '';


    if (
      !cameras ||
      cameras.length === 0
    ) {

      select.innerHTML =
        '<option value="">' +
        'Žádná kamera nenalezena' +
        '</option>';


      result.className =
        'error';


      result.textContent =
        '❌ Nebyla nalezena kamera.';


      return;

    }


    cameras.forEach(

      function(camera, index) {

        const option =
          document
            .createElement(
              'option'
            );


        option.value =
          camera.id;


        option.textContent =
          camera.label ||
          (
            'Kamera ' +
            (index + 1)
          );


        select.appendChild(
          option
        );

      }

    );


    result.className =
      '';


    result.textContent =
      'Vyber kameru a spusť test.';


  } catch (error) {

    result.className =
      'error';


    result.textContent =
      '❌ Kamery se nepodařilo načíst: ' +
      error;

  }

}


// =====================================================
// SPUSTIT TEST KAMERY
// =====================================================

async function startCameraTest() {

  const select =
    document
      .getElementById(
        'cameraSelect'
      );


  selectedCameraId =
    select.value;


  if (!selectedCameraId) {

    return;

  }


  await stopScanner();


  testMode =
    true;


  cameraTestSuccessful =
    false;


  officialBusy =
    false;


  lastCode =
    '';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  const result =
    document
      .getElementById(
        'cameraResult'
      );


  result.className =
    '';


  result.textContent =
    'Spouštím kameru...';


  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    await scanner.start(

      selectedCameraId,

      {

        fps:
          15,


        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(

                Math.min(
                  width,
                  height
                ) * 0.88

              );


            return {

              width:
                size,

              height:
                size

            };

          }

      },

      onQrRead,

      function() {

        // Nepřečtené snímky ignorujeme.

      }

    );


    scanning =
      true;


    result.className =
      '';


    result.textContent =
      '📷 Kamera běží. Naskenuj testovací kartičku.';


  } catch (error) {

    scanning =
      false;


    result.className =
      'error';


    result.textContent =
      '❌ Kameru se nepodařilo spustit: ' +
      error;

  }

}


// =====================================================
// QR PŘEČTEN
// =====================================================

function onQrRead(decodedText) {

  const code =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  // =================================================
  // OCHRANA PROTI NĚKOLIKA STEJNÝM SNÍMKŮM
  // =================================================

  if (
    code === lastCode &&
    now - lastScanTime < 2500
  ) {

    return;

  }


  lastCode =
    code;


  lastScanTime =
    now;


  // =================================================
  // TESTOVACÍ REŽIM
  // =================================================

  if (
    testMode
  ) {

    const result =
      document
        .getElementById(
          'cameraResult'
        );


    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;


      result.className =
        'success';


      result.innerHTML =

        '✅ Kamera QR přečetla správně.<br><br>' +

        '<strong style="font-size:30px;">' +

        code +

        '</strong>';


      document
        .getElementById(
          'confirmCameraButton'
        )
        .style.display =
          'block';

    } else {

      result.className =
        'error';


      result.innerHTML =

        '⚠️ QR byl přečten, ale není ve formátu M/F.<br><br>' +

        '<strong>' +

        code +

        '</strong>';

    }


    return;

  }


  // =================================================
  // OSTRÝ REŽIM
  // =================================================

  if (
    officialBusy
  ) {

    return;

  }


  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    return;

  }


  officialBusy =
    true;


  const result =
    document
      .getElementById(
        'cameraResult'
      );


  result.className =
    'warning';


  result.textContent =
    '⏳ Zpracovávám ' +
    code +
    '...';


  sendCodeToPanel(
    code
  );

}


// =====================================================
// POTVRDIT KAMERU
// =====================================================

function confirmCamera() {

  if (
    !cameraTestSuccessful
  ) {

    return;

  }


  if (
    PANEL_URL.includes(
      'SEM_VLOZ'
    )
  ) {

    alert(
      'Nejdřív vlož do index.html adresu svého Apps Script Panelu.'
    );

    return;

  }


  testMode =
    false;


  officialBusy =
    false;


  lastCode =
    '';


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'officialControls'
    )
    .style.display =
      'block';


  const result =
    document
      .getElementById(
        'cameraResult'
      );


  result.className =
    'success';


  result.textContent =
    '🟢 Kamera připravena na první ostrou kartičku';


  const frame =
    document
      .getElementById(
        'panelFrame'
      );


  frame.src =
    PANEL_URL;


  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'block';

}


// =====================================================
// POSLAT QR DO PANELU
// =====================================================

function sendCodeToPanel(code) {

  const frame =
    document
      .getElementById(
        'panelFrame'
      );


  if (
    !frame ||
    !frame.contentWindow
  ) {

    officialBusy =
      false;

    return;

  }


  frame.contentWindow.postMessage(

    {

      type:
        'attendance-qr',

      code:
        code

    },

    '*'

  );

}


// =====================================================
// PANEL OZNÁMÍ, ŽE JE HOTOVÝ
// =====================================================

window.addEventListener(

  'message',

  function(event) {

    if (
      !event.data ||
      event.data.type !==
        'attendance-finished'
    ) {

      return;

    }


    officialBusy =
      false;


    lastCode =
      '';


    const result =
      document
        .getElementById(
          'cameraResult'
        );


    result.className =
      'success';


    result.textContent =
      '🟢 Připraveno na další kartičku';

  }

);


// =====================================================
// ZMĚNIT KAMERU
// =====================================================

async function changeCamera() {

  testMode =
    true;


  officialBusy =
    false;


  cameraTestSuccessful =
    false;


  lastCode =
    '';


  await stopScanner();


  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'officialControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  const result =
    document
      .getElementById(
        'cameraResult'
      );


  result.className =
    '';


  result.textContent =
    'Vyber kameru a proveď nový test.';

}


// =====================================================
// ZASTAVIT KAMERU
// =====================================================

async function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    await scanner.stop();

  } catch (error) {

    // Ignorujeme.

  }


  try {

    scanner.clear();

  } catch (error) {

    // Ignorujeme.

  }


  scanning =
    false;

}


// =====================================================
// START
// =====================================================

loadCameras();

</script>


</body>

</html>
