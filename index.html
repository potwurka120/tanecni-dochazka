<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f3f3;
      color: #222;
      font-family: Arial, sans-serif;
    }


    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
    }


    h1 {
      text-align: center;
      font-size: 24px;
      margin: 6px 0 12px;
    }


    .camera-box {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }


    .camera-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }


    .camera-info {
      text-align: center;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
    }


    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }


    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .primary {
      background: #222;
      color: white;
    }


    .secondary {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }


    /* =================================================
       TLAČÍTKO POTVRZENÍ KAMERY
       ================================================= */

    #confirmCameraButton {
      display: none;
      background: #176b2c;
      color: white;
      font-size: 18px;
      padding: 17px;
    }


    #confirmCameraButton.visible {
      display: block !important;
    }


    /* =================================================
       MALÉ OKNO KAMERY
       ================================================= */

    .video-box {
      position: relative;

      width: min(86vw, 330px);
      max-width: 330px;

      aspect-ratio: 1 / 1;

      margin: 12px auto 0;

      overflow: hidden;

      border-radius: 16px;

      background: #111;
    }


    #qr-video {
      position: absolute;

      width: 100%;
      height: 100%;

      left: 0;
      top: 0;

      object-fit: cover;

      display: block;
    }


    /* =================================================
       OBRYS SKENOVANÉHO QR

       qr-scanner vytvoří SVG overlay.
       ================================================= */

    .scan-region-highlight {
      border-radius: 14px !important;
    }


    .scan-region-highlight-svg {
      stroke: #ffffff !important;
    }


    .code-outline-highlight {
      stroke: #27b54a !important;
      stroke-width: 5 !important;
      stroke-dasharray: none !important;
    }


    /* =================================================
       ZPRÁVA POD KAMEROU
       ================================================= */

    #cameraMessage {
      margin-top: 10px;
      padding: 13px;
      border-radius: 12px;
      background: #f5f5f5;
      text-align: center;
      line-height: 1.4;
    }


    .success {
      background: #dff3df !important;
      border: 2px solid #70b970;
    }


    .warning {
      background: #fff3cd !important;
      border: 2px solid #e0b400;
    }


    .error {
      background: #ffe5e5 !important;
      border: 2px solid #d66;
    }


    .big-code {
      display: block;
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
    }


    /* =================================================
       ZPRACOVÁVÁM
       ================================================= */

    #scanStatus {
      display: none;

      margin-top: 10px;
      padding: 13px;

      border-radius: 12px;

      background: #fff3cd;
      border: 2px solid #e0b400;

      text-align: center;
      font-weight: bold;
    }


    /* =================================================
       VÝSLEDEK APPS SCRIPTU
       ================================================= */

    #scanResultFrame {
      width: 100%;
      min-height: 135px;
      margin-top: 8px;

      border: none;
      background: transparent;

      display: block;
    }


    /* =================================================
       PANEL
       ================================================= */

    #panelContainer {
      display: none;
      margin-top: 8px;
    }


    #panelFrame {
      display: block;

      width: 100%;
      min-height: 1050px;

      border: none;

      background: #f3f3f3;
    }


    /* =================================================
       ZMĚNA KAMERY ÚPLNĚ DOLE
       ================================================= */

    #bottomCameraControls {
      display: none;
      margin-top: 18px;
      padding-bottom: 35px;
    }


    .bottom-note {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 4px;
    }


    #scanForm {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka
  </h1>


  <div class="camera-box">


    <div class="camera-title">
      📷 QR skener
    </div>


    <!-- ================================================= -->
    <!-- TEST KAMERY -->
    <!-- ================================================= -->

    <div id="setupControls">


      <div class="camera-info">

        Vyber kameru, která dobře čte QR kód.

        <br><br>

        Naskenuj jednu kartičku nanečisto.
        Test se do docházky nezapíše.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        id="testCameraButton"
        class="primary">

        📷 Otestovat vybranou kameru

      </button>


    </div>


    <!-- ================================================= -->
    <!-- KAMERA -->
    <!-- ================================================= -->

    <div class="video-box">

      <video
        id="qr-video"
        playsinline
        muted>
      </video>

    </div>


    <!-- ================================================= -->
    <!-- STAV KAMERY -->
    <!-- ================================================= -->

    <div id="cameraMessage">

      Čekám na výběr kamery.

    </div>


    <!-- ================================================= -->
    <!-- PO ÚSPĚŠNÉM TESTU SE MUSÍ UKÁZAT -->
    <!-- ================================================= -->

    <button
      id="confirmCameraButton">

      ✅ Kamera funguje – spustit docházku

    </button>


    <!-- ================================================= -->
    <!-- ZPRACOVÁNÍ -->
    <!-- ================================================= -->

    <div id="scanStatus">

      ⏳ Zpracovávám...

    </div>


    <!-- ================================================= -->
    <!-- VÝSLEDEK ZÁPISU -->
    <!-- ================================================= -->

    <iframe
      id="scanResultFrame"
      name="scanResultFrame"
      srcdoc="
        <html>
        <body style='
          font-family:Arial;
          text-align:center;
          color:#777;
          padding:22px 5px;
          margin:0;
        '>
          Po spuštění docházky se zde zobrazí výsledek.
        </body>
        </html>
      ">
    </iframe>


  </div>


  <!-- ================================================= -->
  <!-- PANEL -->
  <!-- ================================================= -->

  <div id="panelContainer">

    <iframe
      id="panelFrame"
      src="">
    </iframe>

  </div>


  <!-- ================================================= -->
  <!-- ZMĚNA KAMERY AŽ DOLE -->
  <!-- ================================================= -->

  <div id="bottomCameraControls">


    <div class="bottom-note">

      Použij pouze pokud bude potřeba
      vybrat jinou kameru.

    </div>


    <button
      id="changeCameraButton"
      class="secondary">

      🔄 Změnit / znovu otestovat kameru

    </button>


  </div>


  <!-- ================================================= -->
  <!-- SKRYTÝ FORMULÁŘ -->
  <!-- ================================================= -->

  <form
    id="scanForm"
    method="POST"
    target="scanResultFrame">

    <input
      type="hidden"
      name="action"
      value="scanPage">

    <input
      type="hidden"
      id="scanCode"
      name="code">

  </form>


</div>


<script type="module">


// =====================================================
// QR SCANNER
//
// TUTO KNIHOVNU NEMĚNÍME.
// TA TI QR PRÁVĚ ČTE.
// =====================================================

import QrScanner
  from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


// =====================================================
// SEM VLOŽ SVOJI APPS SCRIPT URL
//
// BEZ ?page=panel
// =====================================================

const WEBAPP_URL =
  'SEM_VLOZ_SVOJI_WEBAPP_URL';


// =====================================================
// PANEL URL
// =====================================================

const PANEL_URL =
  WEBAPP_URL +
  '?page=panel';


// =====================================================
// ELEMENTY
// =====================================================

const video =
  document.getElementById(
    'qr-video'
  );


const select =
  document.getElementById(
    'cameraSelect'
  );


const cameraMessage =
  document.getElementById(
    'cameraMessage'
  );


const confirmCameraButton =
  document.getElementById(
    'confirmCameraButton'
  );


const testCameraButton =
  document.getElementById(
    'testCameraButton'
  );


const changeCameraButton =
  document.getElementById(
    'changeCameraButton'
  );


const resultFrame =
  document.getElementById(
    'scanResultFrame'
  );


// =====================================================
// STAV
// =====================================================

let selectedCameraId =
  '';


let testMode =
  true;


let attendanceMode =
  false;


let cameraTestSuccessful =
  false;


let scannerBusy =
  false;


let pendingScan =
  false;


let lastCode =
  '';


let lastScanTime =
  0;


// =====================================================
// AUDIO
//
// AudioContext vytvoříme až při kliknutí uživatele,
// aby zvuk fungoval i na iPhonu.
// =====================================================

let audioContext =
  null;


function prepareAudio() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {

      return;

    }


    if (!audioContext) {

      audioContext =
        new AudioContextClass();

    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }

  } catch (error) {

    // Zvuk není kritický.

  }

}


// =====================================================
// KRÁTKÉ PÍPNUTÍ
// =====================================================

function beep(
  frequency,
  duration
) {

  try {

    if (!audioContext) {

      return;

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      frequency;


    const now =
      audioContext.currentTime;


    gain.gain.setValueAtTime(
      0.16,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now + duration
    );


    oscillator.start(
      now
    );


    oscillator.stop(
      now + duration
    );


  } catch (error) {

    // Ignorujeme.

  }

}


// =====================================================
// SKENER
// =====================================================

const scanner =
  new QrScanner(

    video,

    function(scanResult) {

      processQr(
        scanResult
      );

    },

    {

      returnDetailedScanResult:
        true,

      highlightScanRegion:
        true,

      highlightCodeOutline:
        true,

      maxScansPerSecond:
        12,

      preferredCamera:
        'environment'

    }

  );


// =====================================================
// NAČTENÍ KAMER
// =====================================================

async function loadCameras() {

  try {

    cameraMessage.className =
      '';


    cameraMessage.textContent =
      '⏳ Povol kameru...';


    // Krátce spustíme kameru kvůli oprávnění
    // a názvům jednotlivých objektivů.

    await scanner.start();


    const cameras =
      await QrScanner.listCameras(
        true
      );


    scanner.stop();


    select.innerHTML =
      '';


    if (
      !cameras ||
      cameras.length === 0
    ) {

      cameraMessage.className =
        'error';


      cameraMessage.textContent =
        '❌ Nebyla nalezena žádná kamera.';


      return;

    }


    cameras.forEach(

      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.id;


        option.textContent =

          (index + 1) +
          '. ' +
          (
            camera.label ||
            'Kamera'
          );


        select.appendChild(
          option
        );

      }

    );


    cameraMessage.className =
      '';


    cameraMessage.textContent =
      'Vyber kameru a spusť test.';


  } catch (error) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =
      '❌ Kameru se nepodařilo připravit: ' +
      error;

  }

}


// =====================================================
// TEST VYBRANÉ KAMERY
// =====================================================

async function startSelectedCamera() {

  prepareAudio();


  selectedCameraId =
    select.value;


  if (!selectedCameraId) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =
      '❌ Nejdřív vyber kameru.';


    return;

  }


  testMode =
    true;


  attendanceMode =
    false;


  cameraTestSuccessful =
    false;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  try {

    scanner.stop();


    await scanner.setCamera(
      selectedCameraId
    );


    await scanner.start();


    cameraMessage.className =
      '';


    cameraMessage.textContent =
      '📷 Kamera běží. Naskenuj testovací kartičku.';


  } catch (error) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =
      '❌ Kameru se nepodařilo spustit: ' +
      error;

  }

}


// =====================================================
// QR PŘEČTEN
// =====================================================

function processQr(
  scanResult
) {

  const code =
    String(

      scanResult &&
      scanResult.data
        ? scanResult.data
        : ''

    )
      .trim()
      .toUpperCase();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  // =================================================
  // OCHRANA PROTI DESÍTKÁM STEJNÝCH SNÍMKŮ
  // =================================================

  if (
    code === lastCode &&
    now - lastScanTime <
      2500
  ) {

    return;

  }


  lastCode =
    code;


  lastScanTime =
    now;


  // =================================================
  // TEST KAMERY
  // =================================================

  if (
    testMode
  ) {

    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;


      // krátké potvrzení přečtení

      beep(
        760,
        0.10
      );


      cameraMessage.className =
        'success';


      cameraMessage.innerHTML =

        '✅ Kamera funguje' +

        '<span class="big-code">' +

        escapeHtml(
          code
        ) +

        '</span>' +

        '<br>' +

        'Teď klikni na zelené tlačítko níže.';


      // =================================================
      // TOTO JE HLAVNÍ OPRAVA:
      // TLAČÍTKO MUSÍ BÝT VIDITELNÉ
      // =================================================

      confirmCameraButton
        .classList
        .add(
          'visible'
        );


      return;

    }


    cameraMessage.className =
      'warning';


    cameraMessage.innerHTML =

      '⚠️ QR byl přečten, ale není ve formátu kartičky.' +

      '<span class="big-code">' +

      escapeHtml(
        code
      ) +

      '</span>';


    return;

  }


  // =================================================
  // OSTRÁ DOCHÁZKA
  // =================================================

  if (
    !attendanceMode
  ) {

    return;

  }


  if (
    scannerBusy
  ) {

    return;

  }


  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    return;

  }


  submitQr(
    code
  );

}


// =====================================================
// POTVRZENÍ KAMERY
// =====================================================

function confirmCamera() {

  prepareAudio();


  if (
    !cameraTestSuccessful
  ) {

    return;

  }


  if (
    WEBAPP_URL.includes(
      'SEM_VLOZ'
    )
  ) {

    alert(
      'Nejdřív vlož svoji Apps Script WEBAPP_URL do index.html.'
    );


    return;

  }


  // =================================================
  // DŮLEŽITÉ:
  //
  // KAMERA SE NEVYPÍNÁ.
  // KAMERA SE NERESTARTUJE.
  // KAMERA SE NEMĚNÍ.
  //
  // Jen přepneme logiku z TEST na DOCHÁZKU.
  // =================================================

  testMode =
    false;


  attendanceMode =
    true;


  cameraTestSuccessful =
    true;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  // schováme nastavení kamery

  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  // zobrazíme Panel

  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'block';


  // tlačítko změny kamery až dole

  document
    .getElementById(
      'bottomCameraControls'
    )
    .style.display =
      'block';


  cameraMessage.className =
    'success';


  cameraMessage.innerHTML =

    '🟢 <strong>Docházka je spuštěná</strong>' +

    '<br>' +

    'Naskenuj první kartičku.';


  resultFrame.srcdoc =

    '<html>' +

    '<body style="' +

    'font-family:Arial;' +

    'text-align:center;' +

    'margin:0;' +

    'padding:25px 5px;' +

    'font-weight:bold;' +

    'font-size:19px;' +

    'color:#176b2c;' +

    '">' +

    'Naskenuj první kartičku' +

    '</body>' +

    '</html>';


  refreshPanel();

}


// =====================================================
// ODESLÁNÍ QR DO APPS SCRIPTU
// =====================================================

function submitQr(
  code
) {

  scannerBusy =
    true;


  pendingScan =
    true;


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.style.display =
    'block';


  status.textContent =
    '⏳ Zpracovávám ' +
    code +
    '...';


  document
    .getElementById(
      'scanCode'
    )
    .value =
      code;


  const form =
    document.getElementById(
      'scanForm'
    );


  form.action =
    WEBAPP_URL;


  form.submit();

}


// =====================================================
// APPS SCRIPT VLOŽIL ODPOVĚĎ DO IFRAME
// =====================================================

resultFrame.addEventListener(

  'load',

  function() {

    if (
      !pendingScan
    ) {

      return;

    }


    pendingScan =
      false;


    scannerBusy =
      false;


    lastCode =
      '';


    lastScanTime =
      Date.now();


    document
      .getElementById(
        'scanStatus'
      )
      .style.display =
        'none';


    // =================================================
    // Krátké vyšší pípnutí:
    //
    // Apps Script odpověděl a skener je připraven
    // na další kartičku.
    //
    // Samotné rozlišení úspěch/duplicita ještě
    // řeší barevná odpověď Apps Scriptu.
    // =================================================

    beep(
      920,
      0.12
    );


    // Kamera se NEZASTAVUJE.
    // Hned může načítat další kartičku.

    refreshPanel();

  }

);


// =====================================================
// OBNOVIT PANEL
// =====================================================

function refreshPanel() {

  const frame =
    document.getElementById(
      'panelFrame'
    );


  frame.src =

    PANEL_URL +

    '&refresh=' +

    Date.now();

}


// =====================================================
// ZMĚNIT KAMERU
// =====================================================

async function changeCamera() {

  attendanceMode =
    false;


  testMode =
    true;


  scannerBusy =
    false;


  pendingScan =
    false;


  cameraTestSuccessful =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  scanner.stop();


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  cameraMessage.className =
    '';


  cameraMessage.textContent =
    'Vyber kameru a spusť nový test.';


  window.scrollTo({

    top:
      0,

    behavior:
      'smooth'

  });

}


// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


// =====================================================
// TLAČÍTKA
// =====================================================

testCameraButton
  .addEventListener(
    'click',
    startSelectedCamera
  );


confirmCameraButton
  .addEventListener(
    'click',
    confirmCamera
  );


changeCameraButton
  .addEventListener(
    'click',
    changeCamera
  );


// =====================================================
// START
// =====================================================

loadCameras();


</script>


</body>

</html>
