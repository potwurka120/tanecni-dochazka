<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f3f3;
      color: #222;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin: 5px 0 10px;
    }

    .camera-box {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .camera-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .camera-info {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }

    button,
    .link-button {
      display: block;
      width: 100%;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    button {
      border: none;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary,
    .home-button {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    #confirmCameraButton {
      display: none;
      background: #176b2c;
      color: white;
      font-size: 18px;
      padding: 16px;
    }

    #confirmCameraButton.visible {
      display: block;
    }

    .video-box {
      position: relative;
      width: min(86vw, 330px);
      max-width: 330px;
      aspect-ratio: 1 / 1;
      margin: 10px auto 0;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
    }

    #qr-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .code-outline-highlight {
      stroke: #27b54a !important;
      stroke-width: 5 !important;
      stroke-dasharray: none !important;
    }

    #cameraMessage {
      margin-top: 10px;
      padding: 12px;
      border-radius: 11px;
      background: #f5f5f5;
      text-align: center;
    }

    .success {
      background: #dff3df !important;
      border: 2px solid #70b970;
    }

    .warning {
      background: #fff3cd !important;
      border: 2px solid #e0b400;
    }

    .error {
      background: #ffe5e5 !important;
      border: 2px solid #d66;
    }

    .big-code {
      display: block;
      font-size: 32px;
      font-weight: bold;
      margin-top: 6px;
    }

    #scanStatus {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 11px;
      background: #fff3cd;
      border: 2px solid #e0b400;
      text-align: center;
      font-weight: bold;
    }

    .result-box {
      margin-top: 10px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .result-label {
      padding: 10px 13px 0;
      font-size: 12px;
      color: #777;
      font-weight: bold;
    }

    #scanResultFrame {
      width: 100%;
      min-height: 175px;
      border: none;
      display: block;
    }

    #doorContainer {
      display: none;
      margin-top: 10px;
    }

    #doorFrame {
      width: 100%;
      min-height: 330px;
      border: none;
      display: block;
      background: #f3f3f3;
    }

    #historyBox {
      display: none;
      margin-top: 10px;
      padding: 15px;
      background: white;
      border-radius: 16px;
      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .history-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .history-note {
      color: #777;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .history-item {
      display: grid;
      grid-template-columns:
        48px 52px 1fr;
      gap: 6px;
      align-items: center;
      padding: 10px 2px;
      border-bottom:
        1px solid #eee;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-time {
      color: #777;
      font-size: 13px;
    }

    .history-card {
      font-weight: bold;
    }

    .history-name {
      font-size: 16px;
      font-weight: bold;
    }

    .history-status {
      grid-column: 3;
      font-size: 12px;
      margin-top: -3px;
    }

    .history-success {
      color: #176b2c;
    }

    .history-warning {
      color: #8a6900;
    }

    .history-error {
      color: #b22;
    }

    .history-hidden {
      display: none;
    }

    #bottomControls {
      display: none;
      margin-top: 12px;
      padding-bottom: 30px;
    }

    #scanForm,
    #overviewForm,
    #overviewFrame {
      display: none;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka
  </h1>


  <!-- KAMERA -->

  <div class="camera-box">

    <div class="camera-title">
      📷 Odbavování u dveří
    </div>


    <div id="setupControls">

      <div class="camera-info">

        Vyber kameru a naskenuj jednu kartičku nanečisto.

        <br>

        Test se do docházky nezapíše.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        id="testCameraButton"
        class="primary">

        📷 Otestovat vybranou kameru

      </button>

    </div>


    <div class="video-box">

      <video
        id="qr-video"
        playsinline
        muted>
      </video>

    </div>


    <div id="cameraMessage">

      Čekám na výběr kamery.

    </div>


    <button id="confirmCameraButton">

      ✅ Kamera funguje – spustit docházku

    </button>


    <div id="scanStatus">

      ⏳ Zpracovávám...

    </div>

  </div>


  <!-- POSLEDNÍ NAČTENÍ -->

  <div class="result-box">

    <div class="result-label">
      POSLEDNÍ NAČTENÍ
    </div>


    <iframe
      id="scanResultFrame"
      name="scanResultFrame"
      srcdoc="
        <html>
        <body style='
          margin:0;
          padding:28px 8px;
          font-family:Arial;
          text-align:center;
          color:#777;
        '>
          Po spuštění docházky se zde zobrazí jméno.
        </body>
        </html>
      ">
    </iframe>

  </div>


  <!-- RUČNÍ ZÁPIS + AKTUÁLNÍ LEKCE -->

  <div id="doorContainer">

    <iframe
      id="doorFrame"
      src="">
    </iframe>

  </div>


  <!-- HISTORIE JE AŽ POD RUČNÍM ZÁPISEM -->

  <div id="historyBox">

    <div class="history-title">

      📋 Historie skenování

    </div>


    <div class="history-note">

      Historie tohoto telefonu.
      Zrušením zápisu z Docházky se historie nemaže.

    </div>


    <div id="historyList"></div>


    <button
      id="olderHistoryButton"
      class="secondary"
      onclick="toggleHistory()"
      style="display:none;">

      Zobrazit starší skeny ▾

    </button>


    <button
      class="secondary"
      onclick="clearScanHistory()">

      🧹 Vymazat historii tohoto telefonu

    </button>

  </div>


  <div id="bottomControls">

    <a
      id="homeLink"
      class="link-button home-button"
      href="#">

      ← Zpět na hlavní stránku

    </a>


    <button
      id="changeCameraButton"
      class="secondary">

      📷 Změnit / znovu otestovat kameru

    </button>

  </div>


  <form
    id="scanForm"
    method="POST"
    target="scanResultFrame">

    <input
      type="hidden"
      name="action"
      value="scan">

    <input
      type="hidden"
      id="scanCode"
      name="code">

  </form>


  <iframe
    id="overviewFrame"
    name="overviewFrame">
  </iframe>


  <form
    id="overviewForm"
    method="POST"
    target="overviewFrame">

    <input
      type="hidden"
      name="action"
      value="refreshOverviews">

  </form>


</div>


<script type="module">


import QrScanner
  from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


const WEBAPP_URL =
  'MUJWEBAPPURL';


const DOOR_PANEL_URL =
  WEBAPP_URL +
  '?page=door';


const HOME_URL =
  WEBAPP_URL;


const HISTORY_KEY =
  'danceAttendanceScanHistory';


const MAX_HISTORY =
  50;


let scanHistory = [];
let historyExpanded = false;


// IDs už zpracovaných zpráv.
// Apps Script může stejnou zprávu poslat
// parent/top kvůli spolehlivosti.

const processedMessages =
  new Set();


const video =
  document.getElementById(
    'qr-video'
  );


const cameraSelect =
  document.getElementById(
    'cameraSelect'
  );


const cameraMessage =
  document.getElementById(
    'cameraMessage'
  );


const testCameraButton =
  document.getElementById(
    'testCameraButton'
  );


const confirmCameraButton =
  document.getElementById(
    'confirmCameraButton'
  );


const changeCameraButton =
  document.getElementById(
    'changeCameraButton'
  );


const resultFrame =
  document.getElementById(
    'scanResultFrame'
  );


const doorFrame =
  document.getElementById(
    'doorFrame'
  );


document
  .getElementById(
    'homeLink'
  )
  .href =
    HOME_URL;


let selectedCameraId = '';
let testMode = true;
let attendanceMode = false;
let cameraTestSuccessful = false;
let scannerBusy = false;
let pendingScan = false;
let lastCode = '';
let lastScanTime = 0;
let overviewRefreshTimer = null;


// =====================================================
// AUDIO
// =====================================================

let audioContext = null;


function prepareAudio() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {
      return;
    }


    if (!audioContext) {

      audioContext =
        new AudioContextClass();
    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();
    }

  } catch (error) {}
}


function beep(
  frequency,
  duration
) {

  try {

    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);
    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      frequency;


    const now =
      audioContext.currentTime;


    gain.gain.setValueAtTime(
      0.15,
      now
    );


    gain.gain
      .exponentialRampToValueAtTime(
        0.001,
        now + duration
      );


    oscillator.start(now);
    oscillator.stop(
      now + duration
    );

  } catch (error) {}
}


// =====================================================
// QR SCANNER
// =====================================================

const scanner =
  new QrScanner(

    video,

    function(result) {

      processQr(result);
    },

    {
      returnDetailedScanResult:
        true,

      highlightScanRegion:
        true,

      highlightCodeOutline:
        true,

      maxScansPerSecond:
        12,

      preferredCamera:
        'environment'
    }

  );


// =====================================================
// HISTORIE
// =====================================================

function loadScanHistory() {

  try {

    const saved =
      sessionStorage.getItem(
        HISTORY_KEY
      );


    if (saved) {

      const parsed =
        JSON.parse(saved);


      if (
        Array.isArray(parsed)
      ) {

        scanHistory =
          parsed;
      }
    }

  } catch (error) {

    scanHistory = [];
  }


  renderScanHistory();
}


function saveScanHistory() {

  try {

    sessionStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(
        scanHistory
      )
    );

  } catch (error) {}
}


function addScanToHistory(data) {

  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      'cs-CZ',
      {
        hour: '2-digit',
        minute: '2-digit'
      }
    );


  let statusText =
    'Nelze zapsat';


  let statusType =
    'error';


  if (
    data.success &&
    data.resultType === 'new'
  ) {

    statusText =
      'Zapsán/a';

    statusType =
      'success';
  }


  else if (
    data.success &&
    data.resultType ===
      'duplicate'
  ) {

    statusText =
      'Už byl/a zapsán/a';

    statusType =
      'warning';
  }


  else if (
    data.resultType ===
      'inactiveCard'
  ) {

    statusText =
      'Ukončená kartička';
  }


  else if (
    data.resultType === 'unknown'
  ) {

    statusText =
      'Neznámá kartička';
  }


  else if (
    data.resultType === 'busy'
  ) {

    statusText =
      'Nezapsáno – zkus znovu';

    statusType =
      'warning';
  }


  scanHistory.unshift({

    time: time,

    cardId:
      data.cardId || '?',

    name:
      data.name ||
      'Neznámý účastník',

    status:
      statusText,

    statusType:
      statusType,

    event:
      data.event || ''

  });


  scanHistory =
    scanHistory.slice(
      0,
      MAX_HISTORY
    );


  saveScanHistory();
  renderScanHistory();
}


function renderScanHistory() {

  const box =
    document.getElementById(
      'historyBox'
    );


  const container =
    document.getElementById(
      'historyList'
    );


  const button =
    document.getElementById(
      'olderHistoryButton'
    );


  container.innerHTML = '';


  if (!scanHistory.length) {

    container.innerHTML =
      '<div style="color:#777;padding:8px 0;">Zatím žádný sken.</div>';


    button.style.display =
      'none';


    return;
  }


  if (attendanceMode) {

    box.style.display =
      'block';
  }


  scanHistory.forEach(

    function(item, index) {

      const div =
        document.createElement(
          'div'
        );


      div.className =
        'history-item';


      if (
        index >= 5 &&
        !historyExpanded
      ) {

        div.classList.add(
          'history-hidden'
        );
      }


      const time =
        document.createElement(
          'div'
        );

      time.className =
        'history-time';

      time.textContent =
        item.time;


      const card =
        document.createElement(
          'div'
        );

      card.className =
        'history-card';

      card.textContent =
        item.cardId;


      const name =
        document.createElement(
          'div'
        );

      name.className =
        'history-name';

      name.textContent =
        item.name;


      const status =
        document.createElement(
          'div'
        );


      status.className =
        'history-status history-' +
        item.statusType;


      status.textContent =
        item.status;


      div.appendChild(time);
      div.appendChild(card);
      div.appendChild(name);
      div.appendChild(status);


      container.appendChild(div);
    }
  );


  button.style.display =
    scanHistory.length > 5
      ? 'block'
      : 'none';


  button.textContent =
    historyExpanded
      ? 'Skrýt starší skeny ▴'
      : 'Zobrazit starší skeny ▾';
}


window.toggleHistory =
  function() {

    historyExpanded =
      !historyExpanded;


    renderScanHistory();
  };


window.clearScanHistory =
  function() {

    if (
      !confirm(
        'Opravdu vymazat historii skenování na tomto telefonu? Docházka v tabulce se tím nezmění.'
      )
    ) {
      return;
    }


    scanHistory = [];
    historyExpanded = false;


    saveScanHistory();
    renderScanHistory();
  };


// =====================================================
// KAMERY
// =====================================================

async function loadCameras() {

  try {

    cameraMessage.textContent =
      '⏳ Povol kameru...';


    await scanner.start();


    const cameras =
      await QrScanner.listCameras(
        true
      );


    scanner.stop();


    cameraSelect.innerHTML = '';


    if (
      !cameras ||
      !cameras.length
    ) {

      cameraMessage.className =
        'error';


      cameraMessage.textContent =
        '❌ Nebyla nalezena žádná kamera.';


      return;
    }


    cameras.forEach(

      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.id;


        option.textContent =
          (index + 1) +
          '. ' +
          (
            camera.label ||
            'Kamera'
          );


        cameraSelect.appendChild(
          option
        );
      }
    );


    try {

      const saved =
        localStorage.getItem(
          'attendanceCameraId'
        );


      if (saved) {

        const exists =
          Array.from(
            cameraSelect.options
          )
          .some(
            option =>
              option.value === saved
          );


        if (exists) {

          cameraSelect.value =
            saved;
        }
      }

    } catch (error) {}


    cameraMessage.className = '';


    cameraMessage.textContent =
      'Vyber kameru a spusť test.';


  } catch (error) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =
      '❌ Kameru se nepodařilo připravit.';
  }
}


async function startSelectedCamera() {

  prepareAudio();


  const newCameraId =
    cameraSelect.value;


  if (!newCameraId) {

    cameraMessage.className =
      'warning';

    cameraMessage.textContent =
      '⚠️ Nejdřív vyber kameru.';

    return;
  }


  selectedCameraId =
    newCameraId;


  testMode =
    true;

  attendanceMode =
    false;

  cameraTestSuccessful =
    false;

  scannerBusy =
    false;

  pendingScan =
    false;

  lastCode =
    '';

  lastScanTime =
    0;


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  cameraMessage.className =
    '';

  cameraMessage.textContent =
    '⏳ Přepínám kameru...';


  try {

    // DŮLEŽITÉ:
    // kameru vypneme okamžitě,
    // aby nedobíhalo staré scanner.stop()

    await scanner.pause(true);


    // Nastavíme přesně kameru,
    // kterou uživatel právě vybral.

    await scanner.setCamera(
      selectedCameraId
    );


    // A znovu ji spustíme.

    await scanner.start();


    cameraMessage.className =
      '';

    cameraMessage.textContent =
      '📷 Naskenuj testovací kartičku.';


  } catch (error) {

    console.error(
      'Chyba při přepnutí kamery:',
      error
    );


    cameraMessage.className =
      'error';

    cameraMessage.textContent =
      '❌ Novou kameru se nepodařilo spustit.';
  }

}


// =====================================================
// QR
// =====================================================

function processQr(scanResult) {

  const code =
    String(
      scanResult &&
      scanResult.data
        ? scanResult.data
        : ''
    )
      .trim()
      .toUpperCase();


  if (!code) {
    return;
  }


  const now =
    Date.now();


  if (
    code === lastCode &&
    now - lastScanTime < 2500
  ) {
    return;
  }


  lastCode = code;
  lastScanTime = now;


  if (testMode) {

    if (
      /^[MF]\d+$/.test(code)
    ) {

      cameraTestSuccessful =
        true;


      beep(
        760,
        0.10
      );


      cameraMessage.className =
        'success';


      cameraMessage.innerHTML =
        '✅ Kamera funguje' +
        '<span class="big-code">' +
        escapeHtml(code) +
        '</span>';


      confirmCameraButton
        .classList
        .add('visible');


      return;
    }


    cameraMessage.className =
      'warning';


    cameraMessage.textContent =
      '⚠️ QR nemá správný formát.';


    return;
  }


  if (
    !attendanceMode ||
    scannerBusy
  ) {
    return;
  }


  if (
    !/^[MF]\d+$/.test(code)
  ) {
    return;
  }


  submitQr(code);
}


// =====================================================
// SPUSTIT DOCHÁZKU
// =====================================================

function confirmCamera() {

  prepareAudio();


  if (
    !cameraTestSuccessful
  ) {
    return;
  }


  if (
    WEBAPP_URL ===
    'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec'
  ) {

    alert(
      'Vlož WEBAPP_URL.'
    );

    return;
  }


  try {

    localStorage.setItem(
      'attendanceCameraId',
      selectedCameraId
    );

  } catch (error) {}


  testMode = false;
  attendanceMode = true;
  scannerBusy = false;
  pendingScan = false;
  lastCode = '';
  lastScanTime = 0;


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';


  confirmCameraButton
    .classList
    .remove('visible');


  cameraMessage.className =
    'success';


  cameraMessage.textContent =
    '🟢 Připraveno na první kartičku';


  document
    .getElementById(
      'doorContainer'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'historyBox'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'bottomControls'
    )
    .style.display =
      'block';


  // Aktuální lekce + ruční zápis.
  // Načte se jen jednou.

  doorFrame.src =
    DOOR_PANEL_URL;


  renderScanHistory();


  resultFrame.srcdoc =
    '<html>' +
    '<body style="' +
    'margin:0;' +
    'padding:28px 8px;' +
    'font-family:Arial;' +
    'font-weight:bold;' +
    'font-size:19px;' +
    'text-align:center;' +
    'color:#176b2c;' +
    '">' +
    'Naskenuj první kartičku' +
    '</body>' +
    '</html>';
}


// =====================================================
// ODESLAT QR
// =====================================================

function submitQr(code) {

  scannerBusy = true;
  pendingScan = true;


  cancelOverviewRefresh();


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.style.display =
    'block';


  status.textContent =
    '⏳ Zpracovávám ' +
    code +
    '...';


  document
    .getElementById(
      'scanCode'
    )
    .value =
      code;


  const form =
    document.getElementById(
      'scanForm'
    );


  form.action =
    WEBAPP_URL;


  form.submit();
}


// =====================================================
// ZPRÁVY Z APPS SCRIPTU
// =====================================================

window.addEventListener(

  'message',

  function(event) {

    const data =
      event.data;


    if (
      !data ||
      typeof data !== 'object'
    ) {
      return;
    }


    if (
      data.messageId
    ) {

      if (
        processedMessages.has(
          data.messageId
        )
      ) {

        return;
      }


      processedMessages.add(
        data.messageId
      );


      setTimeout(
        function() {

          processedMessages.delete(
            data.messageId
          );

        },
        15000
      );
    }


    if (
      data.type ===
      'attendance-result'
    ) {

      // Tohle je okamžik, kdy server už ví:
      // M14 = Jan Novák.
      //
      // Rovnou to přilepíme do historie.
      // Žádný další dotaz na tabulku.

      addScanToHistory(
        data
      );


      finishScan(data);


      scheduleOverviewRefresh();


      return;
    }


    if (
      data.type ===
      'attendance-undo-result'
    ) {

      // Docházka byla smazána,
      // historie zůstává.

      scannerBusy = false;
      pendingScan = false;
      lastCode = '';


      document
        .getElementById(
          'scanStatus'
        )
        .style.display =
          'none';


      cameraMessage.className =
        'success';


      cameraMessage.textContent =
        '🟢 Připraveno na další kartičku';


      scheduleOverviewRefresh();
    }

  }

);


// =====================================================
// HOTOVÝ SKEN
// =====================================================

function finishScan(data) {

  pendingScan = false;
  scannerBusy = false;
  lastCode = '';
  lastScanTime =
    Date.now();


  document
    .getElementById(
      'scanStatus'
    )
    .style.display =
      'none';


  cameraMessage.className =
    'success';


  cameraMessage.textContent =
    '🟢 Připraveno na další kartičku';


  // Pípne pouze skutečně nový zápis.

  if (
    data &&
    data.success &&
    data.resultType === 'new'
  ) {

    beep(
      920,
      0.11
    );
  }
}


// =====================================================
// ZÁLOŽNÍ UVOLNĚNÍ
// =====================================================

resultFrame.addEventListener(

  'load',

  function() {

    if (!pendingScan) {
      return;
    }


    setTimeout(

      function() {

        if (!pendingScan) {
          return;
        }


        // Pokud by postMessage vůbec nedorazil,
        // aspoň nezůstane kamera zamčená.
        //
        // Do historie nic nevymýšlíme,
        // protože bychom neznali jméno.

        pendingScan = false;
        scannerBusy = false;
        lastCode = '';


        document
          .getElementById(
            'scanStatus'
          )
          .style.display =
            'none';


        cameraMessage.className =
          'success';


        cameraMessage.textContent =
          '🟢 Připraveno na další kartičku';

      },

      900
    );
  }

);


// =====================================================
// PŘEHLEDY PO PAUZE
// =====================================================

function scheduleOverviewRefresh() {

  cancelOverviewRefresh();


  overviewRefreshTimer =
    setTimeout(

      function() {

        overviewRefreshTimer =
          null;


        if (scannerBusy) {

          scheduleOverviewRefresh();
          return;
        }


        const form =
          document.getElementById(
            'overviewForm'
          );


        form.action =
          WEBAPP_URL;


        form.submit();

      },

      7000
    );
}


function cancelOverviewRefresh() {

  if (
    overviewRefreshTimer
  ) {

    clearTimeout(
      overviewRefreshTimer
    );


    overviewRefreshTimer =
      null;
  }
}


// =====================================================
// ZMĚNA KAMERY
// =====================================================

async function changeCamera() {

  cancelOverviewRefresh();


  attendanceMode =
    false;

  testMode =
    true;

  scannerBusy =
    false;

  pendingScan =
    false;

  cameraTestSuccessful =
    false;

  lastCode =
    '';

  lastScanTime =
    0;


  // Okamžitě zastavit právě používanou kameru.
  try {

    await scanner.pause(true);

  } catch (error) {

    console.log(
      'Kamera už byla zastavena.'
    );
  }


  // Znovu zobrazíme výběr.
  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  cameraMessage.className =
    '';

  cameraMessage.textContent =
    'Vyber jinou kameru a klikni na „Otestovat vybranou kameru“.';


  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}


function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

testCameraButton

confirmCameraButton

changeCameraButton
