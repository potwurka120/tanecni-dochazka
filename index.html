<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Taneční docházka</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 25px;
    }


    /* ===============================
       LEKCE
       =============================== */

    #eventFrame {
      display: block;
      width: 100%;
      height: 58px;
      border: 0;
      margin: 2px 0 7px 0;
      background: transparent;
      overflow: hidden;
    }


    /* ===============================
       KAMERA – NASTAVENÍ
       =============================== */

    #cameraSetup {
      background: white;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    #cameraSetup label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    #cameraSelect {
      width: 100%;
      padding: 10px;
      margin-bottom: 7px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #e8e8e8;
      color: #222;
    }

    #confirmCameraButton {
      display: none;
      background: #15803d;
      color: white;
    }

    #cameraMessage {
      display: none;
      margin-top: 9px;
      padding: 9px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    #cameraMessage.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #cameraMessage.warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }

    #cameraMessage.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }


    /* ===============================
       VIDEO
       =============================== */

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 390px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 10px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }

    #qrVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /* zelený rámeček QR */

    .scan-region-highlight-svg,
    .scan-region-highlight-svg path,
    .code-outline-highlight,
    .code-outline-highlight path,
    .code-outline-highlight polygon {
      stroke: #22c55e !important;
    }


    /* ===============================
       POSLEDNÍ NAČTENÍ
       =============================== */

    #resultArea {
      display: none;
      margin-top: 8px;
    }

    .sectionTitle {
      margin: 0 0 5px 0;
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }

    #resultWrap {
      position: relative;
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    #scanResultFrame {
      display: block;
      width: 100%;
      height: 220px;
      border: 0;
      background: white;
    }


    /*
      Zpracovávám je samostatná vrstva.
      Formulář může mezitím načítat Apps Script,
      ale tento text nezmizí.
    */

    #processingOverlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: white;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
    }

    #processingText {
      font-size: 17px;
      color: #666;
    }

    #processingCode {
      display: block;
      margin-top: 7px;
      font-size: 25px;
      font-weight: bold;
      color: #222;
    }


    /* ===============================
       RUČNÍ NAČTENÍ
       =============================== */

    #manualArea {
      display: none;
      margin-top: 10px;
    }

    #manualToggle {
      background: #222;
      color: white;
    }

    #manualPanel {
      display: none;
      margin-top: 8px;
    }

    #manualFrame {
      display: block;
      width: 100%;
      height: 355px;
      border: 0;
      background: transparent;
      overflow: hidden;
    }


    /* ===============================
       HISTORIE
       =============================== */

    #historyBox {
      display: none;
      margin-top: 14px;
      padding: 12px;
      background: white;
      border-radius: 12px;
    }

    #historyList {
      font-size: 14px;
    }

    .historyRow {
      display: grid;
      grid-template-columns: 52px 55px 1fr;
      gap: 6px;
      padding: 7px 0;
      border-bottom: 1px solid #eee;
    }

    .historyRow:last-child {
      border-bottom: 0;
    }

    .historyTime {
      color: #777;
    }

    .historyCard {
      font-weight: bold;
    }

    .historyStatus {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #777;
    }

    details {
      margin-top: 8px;
    }

    summary {
      cursor: pointer;
      font-size: 13px;
      color: #555;
    }


    /* ===============================
       DOLE
       =============================== */

    #bottomControls {
      display: none;
      margin-top: 14px;
    }

    .bottomLink {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 9px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      background: white;
      color: #222;
    }

    #changeCameraButton {
      background: #e5e5e5;
      color: #222;
    }


    /* ===============================
       SKRYTÉ
       =============================== */

    #scanForm,
    #refreshForm,
    #refreshFrame {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">


  <h1>💃 Taneční docházka</h1>


  <iframe
    id="eventFrame"
    scrolling="no">
  </iframe>


  <div id="cameraSetup">

    <label for="cameraSelect">
      Vyber kameru
    </label>

    <select id="cameraSelect">
      <option value="">
        Načítám kamery…
      </option>
    </select>


    <button
      id="testCameraButton"
      class="primary"
      type="button">

      📷 Otestovat vybranou kameru

    </button>


    <button
      id="startDirectButton"
      class="secondary"
      type="button">

      ▶️ Rovnou začít skenovat

    </button>


    <div id="cameraMessage"></div>


    <button
      id="confirmCameraButton"
      type="button">

      ✅ Kamera funguje – začít skenovat

    </button>

  </div>


  <div id="videoContainer">

    <video
      id="qrVideo"
      playsinline>
    </video>

  </div>


  <div id="resultArea">

    <div class="sectionTitle">
      POSLEDNÍ NAČTENÍ
    </div>


    <div id="resultWrap">

      <iframe
        id="scanResultFrame"
        name="scanResultFrame"
        scrolling="no">
      </iframe>


      <div id="processingOverlay">

        <div id="processingText">

          Zpracovávám…

          <span id="processingCode"></span>

        </div>

      </div>

    </div>

  </div>


  <div id="manualArea">

    <button
      id="manualToggle"
      type="button">

      ✍️ Nemám kartičku – ruční načtení

    </button>


    <div id="manualPanel">

      <iframe
        id="manualFrame"
        scrolling="no">
      </iframe>

    </div>

  </div>


  <div id="historyBox">

    <div class="sectionTitle">
      📋 Historie v tomto telefonu
    </div>

    <div id="historyList"></div>

  </div>


  <div id="bottomControls">

    <a
      id="homeLink"
      class="bottomLink"
      href="#">

      🏠 Zpět na rozcestník

    </a>


    <button
      id="changeCameraButton"
      type="button">

      🔄 Změnit kameru

    </button>

  </div>


  <form
    id="scanForm"
    method="POST"
    target="scanResultFrame">

    <input
      type="hidden"
      name="action"
      value="scan">

    <input
      id="scanCodeInput"
      type="hidden"
      name="code">

  </form>


  <form
    id="refreshForm"
    method="POST"
    target="refreshFrame">

    <input
      type="hidden"
      name="action"
      value="refreshOverviews">

  </form>


  <iframe
    id="refreshFrame"
    name="refreshFrame">
  </iframe>


</div>


<script type="module">

  import QrScanner
    from
    'https://unpkg.com/qr-scanner@1.4.2/qr-scanner.min.js';


  /* =============================================
     APPS SCRIPT
     ============================================= */

  const APPS_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec';


  /*
    U tebe funguje právě EventPanel,
    proto ho tady necháváme.
  */

  const EVENT_PANEL_URL =
    APPS_SCRIPT_URL +
    '?page=EventPanel';


  const MANUAL_PANEL_URL =
    APPS_SCRIPT_URL +
    '?page=door';


  /* =============================================
     ELEMENTY
     ============================================= */

  const eventFrame =
    document.getElementById(
      'eventFrame'
    );

  const cameraSetup =
    document.getElementById(
      'cameraSetup'
    );

  const cameraSelect =
    document.getElementById(
      'cameraSelect'
    );

  const cameraMessage =
    document.getElementById(
      'cameraMessage'
    );

  const testCameraButton =
    document.getElementById(
      'testCameraButton'
    );

  const startDirectButton =
    document.getElementById(
      'startDirectButton'
    );

  const confirmCameraButton =
    document.getElementById(
      'confirmCameraButton'
    );

  const video =
    document.getElementById(
      'qrVideo'
    );

  const resultArea =
    document.getElementById(
      'resultArea'
    );

  const resultFrame =
    document.getElementById(
      'scanResultFrame'
    );

  const processingOverlay =
    document.getElementById(
      'processingOverlay'
    );

  const processingCode =
    document.getElementById(
      'processingCode'
    );

  const manualArea =
    document.getElementById(
      'manualArea'
    );

  const manualToggle =
    document.getElementById(
      'manualToggle'
    );

  const manualPanel =
    document.getElementById(
      'manualPanel'
    );

  const manualFrame =
    document.getElementById(
      'manualFrame'
    );

  const historyBox =
    document.getElementById(
      'historyBox'
    );

  const historyList =
    document.getElementById(
      'historyList'
    );

  const bottomControls =
    document.getElementById(
      'bottomControls'
    );

  const changeCameraButton =
    document.getElementById(
      'changeCameraButton'
    );

  const scanForm =
    document.getElementById(
      'scanForm'
    );

  const scanCodeInput =
    document.getElementById(
      'scanCodeInput'
    );

  const refreshForm =
    document.getElementById(
      'refreshForm'
    );


  /* =============================================
     URL
     ============================================= */

  eventFrame.src =
    EVENT_PANEL_URL;


  document
    .getElementById(
      'homeLink'
    )
    .href =
      APPS_SCRIPT_URL;


  scanForm.action =
    APPS_SCRIPT_URL;


  refreshForm.action =
    APPS_SCRIPT_URL;


  /* =============================================
     STAV
     ============================================= */

  let testMode =
    false;

  let attendanceMode =
    false;

  let scannerBusy =
    false;

  let lastCode =
    '';

  let lastScanTime =
    0;

  let unlockTimer =
    null;

  let overviewTimer =
    null;


  const handledMessages =
    new Set();


  /* =============================================
     ZVUK
     ============================================= */

  let audioContext =
    null;


  function prepareAudio() {

    try {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state ===
        'suspended'
      ) {

        audioContext.resume();

      }

    } catch (error) {}

  }


  function successBeep() {

    try {

      prepareAudio();


      if (!audioContext) {
        return;
      }


      const oscillator =
        audioContext
          .createOscillator();


      const gain =
        audioContext
          .createGain();


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.frequency.value =
        880;


      gain.gain.value =
        0.08;


      oscillator.start();


      oscillator.stop(
        audioContext.currentTime +
        0.12
      );

    } catch (error) {}

  }


  /* =============================================
     SKENER
     ============================================= */

  const scanner =
    new QrScanner(

      video,

      function(result) {

        handleScan(
          result
        );

      },

      {

        returnDetailedScanResult:
          true,

        highlightScanRegion:
          true,

        highlightCodeOutline:
          true,

        maxScansPerSecond:
          12,

        preferredCamera:
          'environment'

      }

    );


  /* =============================================
     NAČTENÝ QR
     ============================================= */

  function handleScan(
    result
  ) {

    const code =
      String(
        result &&
        result.data
          ? result.data
          : result || ''
      )
        .trim()
        .toUpperCase();


    if (!code) {
      return;
    }


    /*
      TEST KAMERY
    */

    if (testMode) {

      testMode =
        false;


      attendanceMode =
        false;


      cameraMessage.className =
        'success';


      cameraMessage.textContent =
        '✅ Kamera čte QR kód: ' +
        code;


      confirmCameraButton.style.display =
        'block';


      try {
        scanner.pause();
      } catch (error) {}


      return;

    }


    /*
      OSTRÝ REŽIM
    */

    if (!attendanceMode) {
      return;
    }


    if (scannerBusy) {
      return;
    }


    const now =
      Date.now();


    /*
      ochrana před okamžitým
      opakovaným načtením stejné karty
    */

    if (
      code === lastCode &&
      now - lastScanTime <
      1800
    ) {

      return;

    }


    lastCode =
      code;


    lastScanTime =
      now;


    scannerBusy =
      true;


    /*
      ZOBRAZIT IHNED
    */

    showProcessing(
      code
    );


    scanCodeInput.value =
      code;


    try {

      scanForm.submit();

    } catch (error) {

      hideProcessing();

      unlockScanner();

      return;

    }


    /*
      pojistka proti trvalému zaseknutí
    */

    clearTimeout(
      unlockTimer
    );


    unlockTimer =
      setTimeout(
        function() {

          hideProcessing();

          unlockScanner();

        },
        8000
      );

  }


  /* =============================================
     ZPRACOVÁVÁM
     ============================================= */

  function showProcessing(
    code
  ) {

    resultArea.style.display =
      'block';


    processingCode.textContent =
      code;


    processingOverlay.style.display =
      'flex';

  }


  function hideProcessing() {

    processingOverlay.style.display =
      'none';

  }


  /* =============================================
     ODEMKNUTÍ SKENERU
     ============================================= */

  function unlockScanner() {

    clearTimeout(
      unlockTimer
    );


    unlockTimer =
      null;


    /*
      krátká prodleva je schválně
    */

    setTimeout(
      function() {

        scannerBusy =
          false;

      },
      400
    );

  }


  /* =============================================
     KAMERY
     ============================================= */

  async function loadCameras() {

    cameraSelect.innerHTML =
      '';


    try {

      const cameras =
        await QrScanner.listCameras(
          true
        );


      if (
        !cameras ||
        !cameras.length
      ) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          'environment';


        option.textContent =
          'Zadní kamera';


        cameraSelect.appendChild(
          option
        );


        return;

      }


      cameras.forEach(
        function(camera) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            camera.id;


          option.textContent =
            camera.label ||
            'Kamera';


          cameraSelect.appendChild(
            option
          );

        }
      );


      let remembered =
        '';


      try {

        remembered =
          localStorage.getItem(
            'attendanceCameraId'
          ) || '';

      } catch (error) {}


      const exists =
        cameras.some(
          function(camera) {

            return (
              camera.id ===
              remembered
            );

          }
        );


      if (
        remembered &&
        exists
      ) {

        cameraSelect.value =
          remembered;

      }


    } catch (error) {

      cameraSelect.innerHTML =
        '<option value="environment">' +
        'Zadní kamera' +
        '</option>';

    }

  }


  async function activateCamera() {

    prepareAudio();


    const cameraId =
      cameraSelect.value;


    if (!cameraId) {

      cameraMessage.className =
        'warning';


      cameraMessage.textContent =
        '⚠️ Nejdřív vyber kameru.';


      return false;

    }


    try {

      await scanner.pause(
        true
      );


      await scanner.setCamera(
        cameraId
      );


      await scanner.start();


      try {

        localStorage.setItem(
          'attendanceCameraId',
          cameraId
        );

      } catch (error) {}


      return true;


    } catch (error) {

      console.error(
        error
      );


      cameraMessage.className =
        'error';


      cameraMessage.textContent =
        '❌ Vybranou kameru se nepodařilo spustit.';


      return false;

    }

  }


  /* =============================================
     TEST
     ============================================= */

  async function testCamera() {

    const success =
      await activateCamera();


    if (!success) {
      return;
    }


    scannerBusy =
      false;


    attendanceMode =
      false;


    testMode =
      true;


    confirmCameraButton.style.display =
      'none';


    cameraMessage.className =
      'warning';


    cameraMessage.textContent =
      '📷 Ukaž kameře libovolný QR kód.';

  }


  /* =============================================
     ROVNOU SKENOVAT
     ============================================= */

  async function startDirect() {

    const success =
      await activateCamera();


    if (!success) {
      return;
    }


    enterAttendanceMode();

  }


  /* =============================================
     POTVRZENÍ TESTU
     ============================================= */

  async function confirmCamera() {

    try {

      await scanner.start();

    } catch (error) {}


    enterAttendanceMode();

  }


  /* =============================================
     OSTRÝ REŽIM
     ============================================= */

  function enterAttendanceMode() {

    testMode =
      false;


    attendanceMode =
      true;


    scannerBusy =
      false;


    lastCode =
      '';


    lastScanTime =
      0;


    /*
      DŮLEŽITÁ OPRAVA:
      schováme CELÝ bílý box kamery,
      ne jen jeho obsah.
    */

    cameraSetup.style.display =
      'none';


    resultArea.style.display =
      'block';


    manualArea.style.display =
      'block';


    historyBox.style.display =
      'block';


    bottomControls.style.display =
      'block';


    hideProcessing();


    resultFrame.srcdoc =
      '<!DOCTYPE html>' +
      '<html>' +
      '<body style="' +
      'margin:0;' +
      'padding:75px 8px;' +
      'font-family:Arial,sans-serif;' +
      'text-align:center;' +
      'overflow:hidden;' +
      'font-size:18px;' +
      'font-weight:bold;' +
      'color:#777;' +
      '">' +
      'Naskenuj první kartičku' +
      '</body>' +
      '</html>';


    renderHistory();

  }


  /* =============================================
     ZMĚNA KAMERY
     ============================================= */

  async function changeCamera() {

    attendanceMode =
      false;


    testMode =
      false;


    scannerBusy =
      false;


    hideProcessing();


    try {

      await scanner.pause(
        true
      );

    } catch (error) {}


    cameraSetup.style.display =
      'block';


    confirmCameraButton.style.display =
      'none';


    cameraMessage.style.display =
      'none';


    resultArea.style.display =
      'none';


    manualArea.style.display =
      'none';


    manualPanel.style.display =
      'none';


    historyBox.style.display =
      'none';


    bottomControls.style.display =
      'none';


    manualToggle.textContent =
      '✍️ Nemám kartičku – ruční načtení';


    await loadCameras();

  }


  /* =============================================
     RUČNÍ PANEL
     ============================================= */

  function toggleManualPanel() {

    const open =
      manualPanel.style.display ===
      'block';


    if (open) {

      manualPanel.style.display =
        'none';


      manualToggle.textContent =
        '✍️ Nemám kartičku – ruční načtení';


      return;

    }


    if (!manualFrame.src) {

      manualFrame.src =
        MANUAL_PANEL_URL;

    }


    manualPanel.style.display =
      'block';


    manualToggle.textContent =
      '✖ Zavřít ruční načtení';

  }


  /* =============================================
     ZPRÁVY Z APPS SCRIPTU
     ============================================= */

  window.addEventListener(
    'message',
    function(event) {

      const data =
        event.data;


      if (
        !data ||
        typeof data !==
        'object'
      ) {

        return;

      }


      /*
        zabránění duplicitě zprávy
      */

      if (data.messageId) {

        if (
          handledMessages.has(
            data.messageId
          )
        ) {

          return;

        }


        handledMessages.add(
          data.messageId
        );


        if (
          handledMessages.size >
          200
        ) {

          handledMessages.clear();

        }

      }


      /* ===========================
         QR VÝSLEDEK
         =========================== */

      if (
        data.type ===
        'attendance-result'
      ) {

        hideProcessing();


        if (
          data.success &&
          data.resultType ===
          'new'
        ) {

          successBeep();

        }


        addToHistory(
          data
        );


        unlockScanner();


        scheduleOverviewRefresh();


        return;

      }


      /* ===========================
         RUČNÍ VÝSLEDEK
         =========================== */

      if (
        data.type ===
        'manual-attendance-result'
      ) {

        hideProcessing();


        showManualResult(
          data
        );


        addToHistory(
          data
        );


        if (
          data.success &&
          data.resultType ===
          'new'
        ) {

          setTimeout(
            function() {

              manualPanel.style.display =
                'none';


              manualToggle.textContent =
                '✍️ Nemám kartičku – ruční načtení';

            },
            900
          );

        }


        scheduleOverviewRefresh();


        return;

      }


      /* ===========================
         UNDO
         =========================== */

      if (
        data.type ===
        'attendance-undo-result'
      ) {

        hideProcessing();


        unlockScanner();


        scheduleOverviewRefresh();

      }

    }
  );


  /* =============================================
     RUČNÍ VÝSLEDEK
     ============================================= */

  function showManualResult(
    data
  ) {

    resultArea.style.display =
      'block';


    const name =
      getPersonName(
        data
      );


    const card =
      getCardId(
        data
      );


    let background =
      '#fee2e2';


    let color =
      '#991b1b';


    let icon =
      '❌';


    if (
      data.success &&
      data.resultType ===
      'new'
    ) {

      background =
        '#dcfce7';


      color =
        '#166534';


      icon =
        '✅';

    }

    else if (
      data.resultType ===
      'duplicate'
    ) {

      background =
        '#fef3c7';


      color =
        '#92400e';


      icon =
        '⚠️';

    }


    resultFrame.srcdoc =
      '<html>' +
      '<body style="' +
      'margin:0;' +
      'padding:30px 10px;' +
      'font-family:Arial;' +
      'text-align:center;' +
      'overflow:hidden;' +
      'background:' +
      background +
      ';' +
      'color:' +
      color +
      '">' +

      '<div style="font-size:30px">' +
      icon +
      '</div>' +

      '<div style="' +
      'font-size:21px;' +
      'font-weight:bold;' +
      'margin-top:5px">' +

      escapeHtml(
        name
      ) +

      '</div>' +

      (
        card
          ?
          '<div style="margin-top:6px">' +
          escapeHtml(
            card
          ) +
          '</div>'
          :
          ''
      ) +

      '<div style="' +
      'margin-top:9px;' +
      'font-weight:bold">' +

      escapeHtml(
        data.message || ''
      ) +

      '</div>' +

      '</body>' +
      '</html>';

  }


  /* =============================================
     JMÉNO / KARTA
     ============================================= */

  function getPersonName(
    data
  ) {

    if (data.name) {

      return String(
        data.name
      ).trim();

    }


    return (
      String(
        data.firstName || ''
      ).trim() +
      ' ' +
      String(
        data.lastName || ''
      ).trim()
    ).trim();

  }


  function getCardId(
    data
  ) {

    return String(
      data.cardId ||
      data.code ||
      ''
    )
      .trim()
      .toUpperCase();

  }


  /* =============================================
     HISTORIE
     ============================================= */

  const HISTORY_KEY =
    'attendanceHistory';


  function getHistory() {

    try {

      const raw =
        sessionStorage.getItem(
          HISTORY_KEY
        );


      if (!raw) {
        return [];
      }


      const data =
        JSON.parse(
          raw
        );


      if (
        Array.isArray(
          data
        )
      ) {

        return data;

      }


    } catch (error) {}


    return [];

  }


  function saveHistory(
    history
  ) {

    try {

      sessionStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(
          history.slice(
            0,
            50
          )
        )
      );

    } catch (error) {}

  }


  function addToHistory(
    data
  ) {

    const history =
      getHistory();


    const now =
      new Date();


    history.unshift({

      time:
        now.toLocaleTimeString(
          'cs-CZ',
          {
            hour: '2-digit',
            minute: '2-digit'
          }
        ),

      cardId:
        getCardId(
          data
        ),

      name:
        getPersonName(
          data
        ),

      success:
        !!data.success,

      resultType:
        String(
          data.resultType || ''
        ),

      method:
        String(
          data.method || ''
        ),

      message:
        String(
          data.message || ''
        )

    });


    saveHistory(
      history
    );


    renderHistory();

  }


  function renderHistory() {

    const history =
      getHistory();


    if (!history.length) {

      historyList.innerHTML =
        '<div style="color:#888">' +
        'Zatím žádné načtení.' +
        '</div>';


      return;

    }


    const firstFive =
      history.slice(
        0,
        5
      );


    const older =
      history.slice(
        5
      );


    let html =
      firstFive
        .map(
          historyRow
        )
        .join('');


    if (older.length) {

      html +=
        '<details>' +
        '<summary>' +
        'Starší načtení (' +
        older.length +
        ')' +
        '</summary>' +

        older
          .map(
            historyRow
          )
          .join('') +

        '</details>';

    }


    historyList.innerHTML =
      html;

  }


  function historyRow(
    item
  ) {

    let status =
      item.message || 'Chyba';


    if (
      item.success &&
      item.resultType ===
      'new'
    ) {

      status =
        item.method ===
        'Ručně'
          ? 'Zapsáno ručně'
          : 'Zapsáno';

    }

    else if (
      item.resultType ===
      'duplicate'
    ) {

      status =
        'Už je zapsán/a';

    }


    return (
      '<div class="historyRow">' +

        '<div class="historyTime">' +
        escapeHtml(
          item.time
        ) +
        '</div>' +

        '<div class="historyCard">' +
        escapeHtml(
          item.cardId || '—'
        ) +
        '</div>' +

        '<div>' +

          escapeHtml(
            item.name || '—'
          ) +

          '<span class="historyStatus">' +
          escapeHtml(
            status
          ) +
          '</span>' +

        '</div>' +

      '</div>'
    );

  }


  /* =============================================
     PŘEHLEDY
     ============================================= */

  function scheduleOverviewRefresh() {

    clearTimeout(
      overviewTimer
    );


    overviewTimer =
      setTimeout(
        function() {

          try {

            refreshForm.submit();

          } catch (error) {}

        },
        7000
      );

  }


  /* =============================================
     ESCAPE
     ============================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value == null
        ? ''
        : value
    )
      .replace(
        /&/g,
        '&amp;'
      )
      .replace(
        /</g,
        '&lt;'
      )
      .replace(
        />/g,
        '&gt;'
      )
      .replace(
        /"/g,
        '&quot;'
      )
      .replace(
        /'/g,
        '&#039;'
      );

  }


  /* =============================================
     TLAČÍTKA
     ============================================= */

  testCameraButton.addEventListener(
    'click',
    testCamera
  );


  startDirectButton.addEventListener(
    'click',
    startDirect
  );


  confirmCameraButton.addEventListener(
    'click',
    confirmCamera
  );


  changeCameraButton.addEventListener(
    'click',
    changeCamera
  );


  manualToggle.addEventListener(
    'click',
    toggleManualPanel
  );


  /* =============================================
     START
     ============================================= */

  renderHistory();


  await loadCameras();


  /*
    aktualizace názvu lekce
  */

  setInterval(
    function() {

      eventFrame.src =
        EVENT_PANEL_URL +
        '&t=' +
        Date.now();

    },
    60000
  );

</script>

</body>

</html>
