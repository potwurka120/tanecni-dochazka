<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>

  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 680px;
      margin: auto;
      padding: 10px;
    }

    h1 {
      text-align: center;
      margin: 6px 0 12px;
    }

    .camera-box {
      background: white;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .camera-title {
      font-size: 21px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 7px;
    }

    .camera-info {
      text-align: center;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    .confirm {
      display: none;
      background: #176b2c;
      color: white;
    }

    #reader {
      width: 100%;
      margin-top: 12px;
      border-radius: 15px;
      overflow: hidden;
      background: #111;
    }

    #cameraResult {
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      text-align: center;
      background: #f5f5f5;
      line-height: 1.4;
    }

    .success {
      background: #e1f4e1 !important;
      border: 2px solid #69aa69;
    }

    .warning {
      background: #fff3cd !important;
      border: 2px solid #e0b400;
    }

    .error {
      background: #ffe5e5 !important;
      border: 2px solid #d66;
    }

    #officialControls {
      display: none;
    }

    .official-label {
      text-align: center;
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      background: #e1f4e1;
      font-weight: bold;
    }

    #panelContainer {
      display: none;
      margin-top: 10px;
    }

    #panelFrame {
      width: 100%;
      min-height: 1450px;
      border: none;
      display: block;
      background: #f3f3f3;
    }

    @media (max-width: 450px) {

      .container {
        padding: 7px;
      }

      h1 {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka
  </h1>


  <div class="camera-box">


    <div class="camera-title">
      📷 Kamera
    </div>


    <!-- ===================================== -->
    <!-- TEST KAMERY -->
    <!-- ===================================== -->

    <div id="setupControls">


      <div class="camera-info">

        Vyber kameru a každou případně vyzkoušej.

        <br><br>

        Hledáme tu, která dobře zaostří na malý QR kód.
        Testovací sken se do docházky nezapisuje.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        class="primary"
        onclick="startCameraTest()">

        📷 Otestovat vybranou kameru

      </button>

    </div>


    <!-- ===================================== -->
    <!-- ŽIVÝ OBRAZ -->
    <!-- ===================================== -->

    <div id="reader"></div>


    <div id="cameraResult">

      Čekám na výběr kamery.

    </div>


    <button
      id="confirmCameraButton"
      class="confirm"
      onclick="confirmCamera()">

      ✅ Tato kamera funguje – spustit docházku

    </button>


    <!-- ===================================== -->
    <!-- OSTRÝ REŽIM -->
    <!-- ===================================== -->

    <div id="officialControls">


      <div
        id="officialLabel"
        class="official-label">

        ⏳ Načítám docházkový systém...

      </div>


      <button
        class="secondary"
        onclick="changeCamera()">

        🔄 Změnit / znovu otestovat kameru

      </button>

    </div>


  </div>


  <!-- ======================================= -->
  <!-- APPS SCRIPT PANEL -->
  <!-- ======================================= -->

  <div id="panelContainer">

    <iframe
      id="panelFrame"
      src="">
    </iframe>

  </div>


</div>


<script>


// =====================================================
// TVOJE ADRESA PANELU
// =====================================================

// SEM VLOŽ STEJNOU URL, KTEROU JSI TAM MĚLA PŘEDTÍM.

const PANEL_URL =
  'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec?page=panel';


// =====================================================
// PROMĚNNÉ
// =====================================================

let scanner = null;

let scanning = false;

let selectedCameraId = '';

let testMode = true;

let cameraTestSuccessful = false;

let panelReady = false;

let officialBusy = false;

let lastCode = '';

let lastScanTime = 0;


// =====================================================
// NAČTENÍ KAMER
// =====================================================

async function loadCameras() {

  const select =
    document.getElementById(
      'cameraSelect'
    );


  const result =
    document.getElementById(
      'cameraResult'
    );


  try {

    const cameras =
      await Html5Qrcode.getCameras();


    select.innerHTML = '';


    if (
      !cameras ||
      cameras.length === 0
    ) {

      const option =
        document.createElement(
          'option'
        );


      option.value = '';

      option.textContent =
        'Žádná kamera nenalezena';


      select.appendChild(
        option
      );


      result.className =
        'error';


      result.textContent =
        '❌ Nebyla nalezena žádná kamera.';


      return;

    }


    cameras.forEach(

      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.id;


        let label =
          camera.label || '';


        if (!label) {

          label =
            'Kamera ' +
            (index + 1);

        }


        option.textContent =
          (index + 1) +
          '. ' +
          label;


        select.appendChild(
          option
        );

      }

    );


    result.className = '';

    result.textContent =
      'Vyber kameru a spusť test.';


  } catch (error) {

    result.className =
      'error';


    result.textContent =
      '❌ Kamery se nepodařilo načíst: ' +
      error;

  }

}


// =====================================================
// TEST KAMERY
// =====================================================

async function startCameraTest() {

  const select =
    document.getElementById(
      'cameraSelect'
    );


  selectedCameraId =
    select.value;


  if (!selectedCameraId) {

    return;

  }


  await stopScanner();


  testMode =
    true;


  cameraTestSuccessful =
    false;


  panelReady =
    false;


  officialBusy =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  const result =
    document.getElementById(
      'cameraResult'
    );


  result.className = '';

  result.textContent =
    '⏳ Spouštím vybranou kameru...';


  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    // =================================================
    // DŮLEŽITÉ:
    // Vracíme způsob spuštění z verze,
    // ve které ti kamera dobře ostřila.
    // =================================================

    await scanner.start(

      {
        deviceId: {
          exact:
            selectedCameraId
        }
      },

      {

        fps:
          15,


        qrbox:
          function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const width =
              Math.floor(
                viewfinderWidth *
                0.92
              );


            const height =
              Math.floor(

                Math.min(

                  viewfinderHeight *
                  0.78,

                  width

                )

              );


            return {

              width:
                width,

              height:
                height

            };

          },


        // =============================================
        // Vyšší kvalita obrazu.
        // =============================================

        videoConstraints: {

          deviceId: {
            exact:
              selectedCameraId
          },

          width: {
            ideal:
              1920
          },

          height: {
            ideal:
              1080
          },

          frameRate: {
            ideal:
              30
          }

        }

      },

      onQrRead,

      function() {

        // Nepřečtené snímky ignorujeme.

      }

    );


    scanning =
      true;


    // =================================================
    // POKUS O CONTINUOUS AUTOFOCUS
    // =================================================

    await tryEnableAutofocus();


    result.className = '';

    result.textContent =
      '📷 Kamera běží. Přibliž QR kód a počkej, až zaostří.';


  } catch (error) {

    scanning =
      false;


    result.className =
      'error';


    result.textContent =
      '❌ Kameru se nepodařilo spustit: ' +
      error;

  }

}


// =====================================================
// POKUS O AUTOMATICKÉ OSTŘENÍ
// =====================================================

async function tryEnableAutofocus() {

  // html5-qrcode vytvoří uvnitř readeru <video>.
  // Z něj získáme skutečnou video stopu.

  await new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        300
      );

    }
  );


  const reader =
    document.getElementById(
      'reader'
    );


  const video =
    reader.querySelector(
      'video'
    );


  if (
    !video ||
    !video.srcObject
  ) {

    return;

  }


  const tracks =
    video.srcObject
      .getVideoTracks();


  if (
    !tracks ||
    tracks.length === 0
  ) {

    return;

  }


  const track =
    tracks[0];


  try {

    const capabilities =
      track.getCapabilities
        ? track.getCapabilities()
        : {};


    // =================================================
    // CONTINUOUS FOCUS
    // =================================================

    if (
      capabilities.focusMode &&
      capabilities.focusMode.includes(
        'continuous'
      )
    ) {

      await track.applyConstraints({

        advanced: [

          {
            focusMode:
              'continuous'
          }

        ]

      });

    }

  } catch (error) {

    // Některé iPhony/Androidy tuto možnost
    // neposkytují. V tom případě nic nerozbíjíme.

  }

}


// =====================================================
// QR PŘEČTEN
// =====================================================

function onQrRead(decodedText) {

  const code =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  // =================================================
  // STEJNÝ KÓD NEČTEME NĚKOLIKRÁT ZA SEBOU
  // =================================================

  if (
    code === lastCode &&
    now - lastScanTime <
      2500
  ) {

    return;

  }


  lastCode =
    code;


  lastScanTime =
    now;


  // =================================================
  // TEST
  // =================================================

  if (
    testMode
  ) {

    const result =
      document.getElementById(
        'cameraResult'
      );


    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;


      result.className =
        'success';


      result.innerHTML =

        '✅ Tato kamera QR přečetla správně.' +

        '<br><br>' +

        '<strong style="font-size:32px;">' +

        code +

        '</strong>';


      document
        .getElementById(
          'confirmCameraButton'
        )
        .style.display =
          'block';

    }

    else {

      result.className =
        'error';


      result.innerHTML =

        '⚠️ QR byl přečten, ale nemá formát M/F.' +

        '<br><br>' +

        '<strong>' +

        code +

        '</strong>';

    }


    return;

  }


  // =================================================
  // OSTRÁ DOCHÁZKA
  // =================================================

  if (
    officialBusy ||
    !panelReady
  ) {

    return;

  }


  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    return;

  }


  officialBusy =
    true;


  const result =
    document.getElementById(
      'cameraResult'
    );


  result.className =
    'warning';


  result.textContent =
    '⏳ Zpracovávám ' +
    code +
    '...';


  sendCodeToPanel(
    code
  );

}


// =====================================================
// POTVRDIT FUNKČNÍ KAMERU
// =====================================================

function confirmCamera() {

  if (
    !cameraTestSuccessful
  ) {

    return;

  }


  if (
    PANEL_URL.includes(
      'SEM_VLOZ'
    )
  ) {

    alert(
      'Nejdřív vlož svoji PANEL_URL do index.html.'
    );

    return;

  }


  testMode =
    false;


  panelReady =
    false;


  officialBusy =
    true;


  lastCode =
    '';


  lastScanTime =
    0;


  // =================================================
  // KAMERA SE NEVYPÍNÁ.
  //
  // Stejná kamera, která právě úspěšně přečetla
  // testovací QR, pokračuje v ostrém režimu.
  // =================================================


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'officialControls'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'officialLabel'
    )
    .textContent =
      '⏳ Načítám docházkový systém...';


  const result =
    document.getElementById(
      'cameraResult'
    );


  result.className =
    'warning';


  result.textContent =
    '⏳ Kamera funguje. Čekám na připravení docházky...';


  // =================================================
  // NAČTENÍ PANELU
  // =================================================

  const frame =
    document.getElementById(
      'panelFrame'
    );


  frame.src =
    PANEL_URL;


  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'block';

}


// =====================================================
// POSLAT QR DO PANELU
// =====================================================

function sendCodeToPanel(code) {

  const frame =
    document.getElementById(
      'panelFrame'
    );


  if (
    !frame ||
    !frame.contentWindow
  ) {

    officialBusy =
      false;


    return;

  }


  frame.contentWindow.postMessage(

    {

      type:
        'attendance-qr',

      code:
        code

    },

    '*'

  );

}


// =====================================================
// ZPRÁVY Z APPS SCRIPT PANELU
// =====================================================

window.addEventListener(

  'message',

  function(event) {

    if (
      !event.data
    ) {

      return;

    }


    // =================================================
    // PANEL JE NAČTENÝ
    // =================================================

    if (
      event.data.type ===
      'attendance-panel-ready'
    ) {

      panelReady =
        true;


      officialBusy =
        false;


      lastCode =
        '';


      lastScanTime =
        0;


      document
        .getElementById(
          'officialLabel'
        )
        .textContent =
          '🟢 Ostré skenování zapnuto';


      const result =
        document.getElementById(
          'cameraResult'
        );


      result.className =
        'success';


      result.textContent =
        '🟢 Vše připraveno – naskenuj první kartičku';


      return;

    }


    // =================================================
    // SERVER DOKONČIL JEDEN ZÁPIS
    // =================================================

    if (
      event.data.type ===
      'attendance-finished'
    ) {

      officialBusy =
        false;


      lastCode =
        '';


      lastScanTime =
        0;


      const result =
        document.getElementById(
          'cameraResult'
        );


      result.className =
        'success';


      result.textContent =
        '🟢 Připraveno na další kartičku';


      return;

    }

  }

);


// =====================================================
// ZMĚNIT KAMERU
// =====================================================

async function changeCamera() {

  testMode =
    true;


  officialBusy =
    false;


  panelReady =
    false;


  cameraTestSuccessful =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  await stopScanner();


  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'panelFrame'
    )
    .src =
      '';


  document
    .getElementById(
      'officialControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  const result =
    document.getElementById(
      'cameraResult'
    );


  result.className = '';

  result.textContent =
    'Vyber kameru a proveď nový test.';

}


// =====================================================
// ZASTAVIT KAMERU
// =====================================================

async function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    await scanner.stop();

  } catch (error) {

    // Ignorujeme.

  }


  try {

    scanner.clear();

  } catch (error) {

    // Ignorujeme.

  }


  scanning =
    false;

}


// =====================================================
// START
// =====================================================

loadCameras();

</script>


</body>

</html>
