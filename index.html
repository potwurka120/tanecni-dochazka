<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Taneční docházka</title>

  <script
    type="module"
    src="https://unpkg.com/qr-scanner@1.4.2/qr-scanner.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 18px;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      color: #222;
    }


    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }


    h1 {
      margin: 0 0 8px 0;
      text-align: center;
      font-size: 25px;
    }


    /* ==========================================
       AKTUÁLNÍ LEKCE
       ========================================== */

    #eventFrame {
      display: block;
      width: 100%;
      height: 74px;
      border: 0;
      margin: 0 0 10px 0;
      background: transparent;
      overflow: hidden;
    }


    /* ==========================================
       KAMERA
       ========================================== */

    #cameraSetup {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
    }


    #cameraSetup label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }


    #cameraSelect {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }


    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .primary {
      background: #111;
      color: white;
    }


    .secondary {
      background: #e9e9e9;
      color: #222;
    }


    .successButton {
      display: none;
      background: #15803d;
      color: white;
    }


    #cameraMessage {
      display: none;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }


    #cameraMessage.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }


    #cameraMessage.warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }


    #cameraMessage.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }


    /* ==========================================
       VIDEO
       ========================================== */

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 390px;
      aspect-ratio: 1 / 1;
      margin: 0 auto 12px auto;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }


    #qrVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    /*
      ZELENÝ RÁMEČEK QR
    */

    .scan-region-highlight-svg,
    .scan-region-highlight-svg path,
    .code-outline-highlight,
    .code-outline-highlight path,
    .code-outline-highlight polygon {
      stroke: #22c55e !important;
    }


    /* ==========================================
       POSLEDNÍ NAČTENÍ
       ========================================== */

    #resultArea {
      display: none;
      margin-top: 12px;
    }


    .sectionTitle {
      margin: 0 0 6px 0;
      font-size: 14px;
      font-weight: bold;
      color: #555;
    }


    #scanResultFrame {
      display: block;
      width: 100%;
      height: 220px;
      border: 0;
      border-radius: 12px;
      background: white;
      overflow: hidden;
    }


    /* ==========================================
       RUČNÍ NAČTENÍ
       ========================================== */

    #manualArea {
      display: none;
      margin-top: 10px;
    }


    #manualToggle {
      background: #222;
      color: white;
    }


    #manualPanel {
      display: none;
      margin-top: 8px;
    }


    #manualFrame {
      display: block;
      width: 100%;
      height: 355px;
      border: 0;
      background: transparent;
      overflow: hidden;
    }


    /* ==========================================
       HISTORIE
       ========================================== */

    #historyBox {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: white;
      border-radius: 12px;
    }


    #historyList {
      font-size: 14px;
    }


    .historyRow {
      display: grid;
      grid-template-columns: 54px 58px 1fr;
      gap: 6px;
      padding: 7px 0;
      border-bottom: 1px solid #eee;
      align-items: start;
    }


    .historyRow:last-child {
      border-bottom: 0;
    }


    .historyTime {
      color: #777;
    }


    .historyCard {
      font-weight: bold;
    }


    .historyName {
      word-break: break-word;
    }


    .historyStatus {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #777;
    }


    details {
      margin-top: 8px;
    }


    summary {
      cursor: pointer;
      font-size: 13px;
      color: #555;
    }


    /* ==========================================
       SPODNÍ OVLÁDÁNÍ
       ========================================== */

    #bottomControls {
      display: none;
      margin-top: 16px;
    }


    .bottomLink {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 9px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      background: white;
      color: #222;
    }


    #changeCameraButton {
      background: #e5e5e5;
      color: #222;
    }


    /* ==========================================
       SKRYTÉ FORMULÁŘE
       ========================================== */

    #scanForm,
    #refreshForm {
      display: none;
    }


  </style>

</head>


<body>

  <div class="container">


    <h1>💃 Taneční docházka</h1>


    <!-- AKTUÁLNÍ LEKCE -->

    <iframe
      id="eventFrame"
      scrolling="no">
    </iframe>


    <!-- NASTAVENÍ KAMERY -->

    <div id="cameraSetup">

      <div id="setupControls">

        <label for="cameraSelect">
          Vyber kameru
        </label>

        <select id="cameraSelect">
          <option value="">
            Načítám kamery…
          </option>
        </select>


        <button
          id="testCameraButton"
          class="primary"
          type="button">

          📷 Otestovat vybranou kameru

        </button>


        <button
          id="startDirectButton"
          class="secondary"
          type="button">

          ▶️ Rovnou začít skenovat

        </button>

      </div>


      <div
        id="cameraMessage">
      </div>


      <button
        id="confirmCameraButton"
        class="successButton"
        type="button">

        ✅ Kamera funguje – začít skenovat

      </button>

    </div>


    <!-- VIDEO -->

    <div id="videoContainer">

      <video
        id="qrVideo"
        playsinline>
      </video>

    </div>


    <!-- POSLEDNÍ NAČTENÍ -->

    <div id="resultArea">

      <div class="sectionTitle">
        POSLEDNÍ NAČTENÍ
      </div>

      <iframe
        id="scanResultFrame"
        name="scanResultFrame"
        scrolling="no">
      </iframe>

    </div>


    <!-- RUČNÍ NAČTENÍ -->

    <div id="manualArea">

      <button
        id="manualToggle"
        type="button"
        onclick="toggleManualPanel()">

        ✍️ Nemám kartičku – ruční načtení

      </button>


      <div id="manualPanel">

        <iframe
          id="manualFrame"
          scrolling="no">
        </iframe>

      </div>

    </div>


    <!-- HISTORIE -->

    <div id="historyBox">

      <div class="sectionTitle">
        📋 Historie v tomto telefonu
      </div>

      <div id="historyList">
      </div>

    </div>


    <!-- SPODNÍ OVLÁDÁNÍ -->

    <div id="bottomControls">

      <a
        id="homeLink"
        class="bottomLink"
        href="#">

        🏠 Zpět na rozcestník

      </a>


      <button
        id="changeCameraButton"
        type="button">

        🔄 Změnit kameru

      </button>

    </div>


    <!-- SKRYTÝ QR FORMULÁŘ -->

    <form
      id="scanForm"
      method="POST"
      target="scanResultFrame">

      <input
        type="hidden"
        name="action"
        value="scan">

      <input
        id="scanCodeInput"
        type="hidden"
        name="code"
        value="">

    </form>


    <!-- SKRYTÉ OBNOVENÍ PŘEHLEDŮ -->

    <form
      id="refreshForm"
      method="POST"
      target="refreshFrame">

      <input
        type="hidden"
        name="action"
        value="refreshOverviews">

    </form>


    <iframe
      id="refreshFrame"
      name="refreshFrame"
      style="display:none;">
    </iframe>


  </div>


  <script type="module">

    import QrScanner
      from
      'https://unpkg.com/qr-scanner@1.4.2/qr-scanner.min.js';


    /* =====================================================
       TADY VLOŽ SVOU STÁVAJÍCÍ APPS SCRIPT /EXEC ADRESU
       ===================================================== */

    const APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec';


    /* =====================================================
       URL
       ===================================================== */

    const EVENT_PANEL_URL =
      APPS_SCRIPT_URL +
      '?page=event';


    const MANUAL_PANEL_URL =
      APPS_SCRIPT_URL +
      '?page=door';


    const HOME_URL =
      APPS_SCRIPT_URL;


    /* =====================================================
       ELEMENTY
       ===================================================== */

    const video =
      document.getElementById(
        'qrVideo'
      );


    const cameraSelect =
      document.getElementById(
        'cameraSelect'
      );


    const cameraMessage =
      document.getElementById(
        'cameraMessage'
      );


    const testCameraButton =
      document.getElementById(
        'testCameraButton'
      );


    const startDirectButton =
      document.getElementById(
        'startDirectButton'
      );


    const confirmCameraButton =
      document.getElementById(
        'confirmCameraButton'
      );


    const setupControls =
      document.getElementById(
        'setupControls'
      );


    const resultArea =
      document.getElementById(
        'resultArea'
      );


    const resultFrame =
      document.getElementById(
        'scanResultFrame'
      );


    const manualArea =
      document.getElementById(
        'manualArea'
      );


    const manualPanel =
      document.getElementById(
        'manualPanel'
      );


    const manualFrame =
      document.getElementById(
        'manualFrame'
      );


    const manualToggle =
      document.getElementById(
        'manualToggle'
      );


    const historyBox =
      document.getElementById(
        'historyBox'
      );


    const historyList =
      document.getElementById(
        'historyList'
      );


    const bottomControls =
      document.getElementById(
        'bottomControls'
      );


    const changeCameraButton =
      document.getElementById(
        'changeCameraButton'
      );


    const scanForm =
      document.getElementById(
        'scanForm'
      );


    const scanCodeInput =
      document.getElementById(
        'scanCodeInput'
      );


    const refreshForm =
      document.getElementById(
        'refreshForm'
      );


    /* =====================================================
       NASTAVENÍ URL
       ===================================================== */

    document
      .getElementById(
        'eventFrame'
      )
      .src =
        EVENT_PANEL_URL;


    document
      .getElementById(
        'homeLink'
      )
      .href =
        HOME_URL;


    scanForm.action =
      APPS_SCRIPT_URL;


    refreshForm.action =
      APPS_SCRIPT_URL;


    /* =====================================================
       STAV SKENERU
       ===================================================== */

    let selectedCameraId =
      '';


    let testMode =
      false;


    let attendanceMode =
      false;


    let scannerBusy =
      false;


    let lastCode =
      '';


    let lastScanTime =
      0;


    let scanUnlockTimer =
      null;


    let overviewRefreshTimer =
      null;


    const handledMessageIds =
      new Set();


    /* =====================================================
       AUDIO
       ===================================================== */

    let audioContext =
      null;


    function prepareAudio() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          'suspended'
        ) {

          audioContext.resume();

        }

      } catch (error) {}

    }


    function successBeep() {

      try {

        prepareAudio();


        if (!audioContext) {

          return;

        }


        const oscillator =
          audioContext
            .createOscillator();


        const gain =
          audioContext
            .createGain();


        oscillator
          .connect(
            gain
          );


        gain
          .connect(
            audioContext.destination
          );


        oscillator.frequency.value =
          880;


        gain.gain.value =
          0.08;


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime +
          0.12
        );

      } catch (error) {}

    }


    /* =====================================================
       QR SKENER
       ===================================================== */

    const scanner =
      new QrScanner(

        video,

        function(result) {

          handleQrResult(
            result
          );

        },

        {

          returnDetailedScanResult:
            true,

          highlightScanRegion:
            true,

          highlightCodeOutline:
            true,

          maxScansPerSecond:
            12,

          preferredCamera:
            'environment'

        }

      );


    /* =====================================================
       QR VÝSLEDEK
       ===================================================== */

    function handleQrResult(
      result
    ) {

      const code =
        String(
          result &&
          result.data
            ? result.data
            : result || ''
        )
          .trim()
          .toUpperCase();


      if (!code) {

        return;

      }


      /* -----------------------------------------
         TEST KAMERY
         ----------------------------------------- */

      if (testMode) {

        testMode =
          false;


        attendanceMode =
          false;


        cameraMessage.className =
          'success';


        cameraMessage.textContent =
          '✅ Kamera čte QR kód: ' +
          code;


        confirmCameraButton.style.display =
          'block';


        scanner.pause(
          false
        );


        return;

      }


      /* -----------------------------------------
         JEŠTĚ NEJSME V OSTRÉM REŽIMU
         ----------------------------------------- */

      if (!attendanceMode) {

        return;

      }


      /* -----------------------------------------
         SKENER ČEKÁ NA VÝSLEDEK PŘEDCHOZÍHO ČLOVĚKA
         ----------------------------------------- */

      if (scannerBusy) {

        return;

      }


      const now =
        Date.now();


      /*
        Krátká ochrana proti okamžitému
        dvojímu přečtení stejného QR.
      */

      if (
        code === lastCode &&
        now - lastScanTime <
          1800
      ) {

        return;

      }


      lastCode =
        code;


      lastScanTime =
        now;


      scannerBusy =
        true;


      showProcessing(
        code
      );


      scanCodeInput.value =
        code;


      try {

        scanForm.submit();

      } catch (error) {

        releaseScanner();

        return;

      }


      /*
        Bezpečnostní pojistka:
        pokud by se Apps Script neozval,
        skener nezůstane zamčený navždy.
      */

      if (
        scanUnlockTimer
      ) {

        clearTimeout(
          scanUnlockTimer
        );

      }


      scanUnlockTimer =
        setTimeout(
          function() {

            releaseScanner();

          },
          6500
        );

    }


    /* =====================================================
       ZOBRAZENÍ "ZPRACOVÁVÁM"
       ===================================================== */

    function showProcessing(
      code
    ) {

      resultArea.style.display =
        'block';


      resultFrame.srcdoc =

        '<!DOCTYPE html>' +

        '<html>' +

        '<body style="' +

        'margin:0;' +
        'padding:58px 8px;' +
        'font-family:Arial,sans-serif;' +
        'text-align:center;' +
        'overflow:hidden;' +
        'color:#666;' +

        '">' +

        '<div style="' +
        'font-size:15px;' +
        'margin-bottom:8px;' +
        '">' +

        'Zpracovávám…' +

        '</div>' +

        '<strong style="' +
        'font-size:22px;' +
        'color:#222;' +
        '">' +

        escapeHtml(
          code
        ) +

        '</strong>' +

        '</body>' +

        '</html>';

    }


    /* =====================================================
       UVOLNĚNÍ SKENERU PO VÝSLEDKU
       ===================================================== */

    function releaseScanner() {

      if (
        scanUnlockTimer
      ) {

        clearTimeout(
          scanUnlockTimer
        );


        scanUnlockTimer =
          null;

      }


      /*
        Malá prodleva zabrání tomu,
        aby stejná kartička ležící stále
        před kamerou okamžitě vyvolala
        další načtení.
      */

      setTimeout(
        function() {

          scannerBusy =
            false;

        },
        450
      );

    }


    /* =====================================================
       SEZNAM KAMER
       ===================================================== */

    async function loadCameras() {

      cameraSelect.innerHTML =
        '';


      try {

        const cameras =
          await QrScanner.listCameras(
            true
          );


        if (
          !cameras ||
          !cameras.length
        ) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            'environment';


          option.textContent =
            'Zadní kamera';


          cameraSelect.appendChild(
            option
          );


          selectedCameraId =
            'environment';


          return;

        }


        cameras.forEach(
          function(camera) {

            const option =
              document.createElement(
                'option'
              );


            option.value =
              camera.id;


            option.textContent =
              camera.label ||
              'Kamera';


            cameraSelect.appendChild(
              option
            );

          }
        );


        let remembered =
          '';


        try {

          remembered =
            localStorage.getItem(
              'attendanceCameraId'
            ) || '';

        } catch (error) {}


        if (
          remembered &&
          cameras.some(
            function(camera) {

              return (
                camera.id ===
                remembered
              );

            }
          )
        ) {

          cameraSelect.value =
            remembered;

        }


        selectedCameraId =
          cameraSelect.value;


      } catch (error) {

        cameraSelect.innerHTML =
          '<option value="environment">' +
          'Zadní kamera' +
          '</option>';


        selectedCameraId =
          'environment';

      }

    }


    /* =====================================================
       SPUŠTĚNÍ VYBRANÉ KAMERY
       ===================================================== */

    async function activateSelectedCamera() {

      prepareAudio();


      const cameraId =
        cameraSelect.value;


      if (!cameraId) {

        cameraMessage.className =
          'warning';


        cameraMessage.textContent =
          '⚠️ Nejdřív vyber kameru.';


        return false;

      }


      selectedCameraId =
        cameraId;


      try {

        /*
          Toto je důležité při přepínání kamer.
        */

        await scanner.pause(
          true
        );


        await scanner.setCamera(
          selectedCameraId
        );


        await scanner.start();


        try {

          localStorage.setItem(
            'attendanceCameraId',
            selectedCameraId
          );

        } catch (error) {}


        return true;


      } catch (error) {

        console.error(
          error
        );


        cameraMessage.className =
          'error';


        cameraMessage.textContent =
          '❌ Vybranou kameru se nepodařilo spustit.';


        return false;

      }

    }


    /* =====================================================
       TEST KAMERY
       ===================================================== */

    async function startCameraTest() {

      const success =
        await activateSelectedCamera();


      if (!success) {

        return;

      }


      scannerBusy =
        false;


      attendanceMode =
        false;


      testMode =
        true;


      confirmCameraButton.style.display =
        'none';


      cameraMessage.className =
        'warning';


      cameraMessage.textContent =
        '📷 Ukaž kameře libovolný QR kód.';

    }


    /* =====================================================
       ROVNOU ZAČÍT SKENOVAT
       ===================================================== */

    async function startDirectScanning() {

      const success =
        await activateSelectedCamera();


      if (!success) {

        return;

      }


      enterAttendanceMode();

    }


    /* =====================================================
       POTVRZENÍ ÚSPĚŠNÉHO TESTU
       ===================================================== */

    async function confirmTestedCamera() {

      try {

        await scanner.start();

      } catch (error) {}


      enterAttendanceMode();

    }


    /* =====================================================
       OSTRÝ REŽIM DOCHÁZKY
       ===================================================== */

    function enterAttendanceMode() {

      testMode =
        false;


      attendanceMode =
        true;


      scannerBusy =
        false;


      lastCode =
        '';


      lastScanTime =
        0;


      setupControls.style.display =
        'none';


      confirmCameraButton.style.display =
        'none';


      cameraMessage.style.display =
        'none';


      resultArea.style.display =
        'block';


      manualArea.style.display =
        'block';


      historyBox.style.display =
        'block';


      bottomControls.style.display =
        'block';


      resultFrame.srcdoc =

        '<!DOCTYPE html>' +

        '<html>' +

        '<body style="' +

        'margin:0;' +
        'padding:72px 8px;' +
        'font-family:Arial,sans-serif;' +
        'text-align:center;' +
        'overflow:hidden;' +
        'font-size:18px;' +
        'font-weight:bold;' +
        'color:#777;' +

        '">' +

        'Naskenuj první kartičku' +

        '</body>' +

        '</html>';

    }


    /* =====================================================
       ZMĚNA KAMERY
       ===================================================== */

    async function changeCamera() {

      attendanceMode =
        false;


      testMode =
        false;


      scannerBusy =
        false;


      try {

        await scanner.pause(
          true
        );

      } catch (error) {}


      setupControls.style.display =
        'block';


      confirmCameraButton.style.display =
        'none';


      cameraMessage.style.display =
        'none';


      resultArea.style.display =
        'none';


      manualArea.style.display =
        'none';


      manualPanel.style.display =
        'none';


      historyBox.style.display =
        'none';


      bottomControls.style.display =
        'none';


      manualToggle.textContent =
        '✍️ Nemám kartičku – ruční načtení';


      await loadCameras();

    }


    /* =====================================================
       RUČNÍ NAČTENÍ
       ===================================================== */

    window.toggleManualPanel =
      function() {

        const isOpen =
          manualPanel.style.display ===
          'block';


        if (isOpen) {

          manualPanel.style.display =
            'none';


          manualToggle.textContent =
            '✍️ Nemám kartičku – ruční načtení';


          return;

        }


        if (!manualFrame.src) {

          manualFrame.src =
            MANUAL_PANEL_URL;

        }


        manualPanel.style.display =
          'block';


        manualToggle.textContent =
          '✖ Zavřít ruční načtení';

      };


    /* =====================================================
       POSTMESSAGE Z APPS SCRIPTU
       ===================================================== */

    window.addEventListener(
      'message',
      function(event) {

        const data =
          event.data;


        if (
          !data ||
          typeof data !==
          'object'
        ) {

          return;

        }


        /*
          scannerResultHtml posílá zprávu
          více úrovněmi iframe.
          messageId zabrání vícenásobnému zpracování.
        */

        if (
          data.messageId
        ) {

          if (
            handledMessageIds.has(
              data.messageId
            )
          ) {

            return;

          }


          handledMessageIds.add(
            data.messageId
          );


          if (
            handledMessageIds.size >
            200
          ) {

            handledMessageIds.clear();

          }

        }


        /* -----------------------------------------
           QR VÝSLEDEK
           ----------------------------------------- */

        if (
          data.type ===
          'attendance-result'
        ) {

          if (
            data.success &&
            data.resultType ===
            'new'
          ) {

            successBeep();

          }


          addScanToHistory(
            data
          );


          releaseScanner();


          scheduleOverviewRefresh();


          return;

        }


        /* -----------------------------------------
           RUČNÍ VÝSLEDEK
           ----------------------------------------- */

        if (
          data.type ===
          'manual-attendance-result'
        ) {

          showManualAsLastRead(
            data
          );


          addScanToHistory(
            data
          );


          if (
            data.success &&
            data.resultType ===
            'new'
          ) {

            setTimeout(
              function() {

                manualPanel.style.display =
                  'none';


                manualToggle.textContent =
                  '✍️ Nemám kartičku – ruční načtení';

              },
              900
            );

          }


          scheduleOverviewRefresh();


          return;

        }


        /* -----------------------------------------
           ZRUŠENÍ POSLEDNÍHO ZÁPISU
           ----------------------------------------- */

        if (
          data.type ===
          'attendance-undo-result'
        ) {

          releaseScanner();


          scheduleOverviewRefresh();


          return;

        }

      }
    );


    /* =====================================================
       RUČNÍ ZÁPIS JAKO POSLEDNÍ NAČTENÍ
       ===================================================== */

    function showManualAsLastRead(
      data
    ) {

      resultArea.style.display =
        'block';


      const success =
        !!data.success;


      const duplicate =
        data.resultType ===
        'duplicate';


      let background =
        '#fee2e2';


      let color =
        '#991b1b';


      let icon =
        '❌';


      if (
        success &&
        !duplicate
      ) {

        background =
          '#dcfce7';


        color =
          '#166534';


        icon =
          '✅';

      }

      else if (
        duplicate
      ) {

        background =
          '#fef3c7';


        color =
          '#92400e';


        icon =
          '⚠️';

      }


      const name =
        String(
          data.name || ''
        );


      const cardId =
        String(
          data.cardId || ''
        );


      let message =
        String(
          data.message || ''
        );


      if (!message) {

        if (
          success &&
          !duplicate
        ) {

          message =
            'Zapsáno ručně';

        }

        else if (
          duplicate
        ) {

          message =
            'Už je zapsán/a';

        }

        else {

          message =
            'Zápis se nepodařil';

        }

      }


      resultFrame.srcdoc =

        '<!DOCTYPE html>' +

        '<html>' +

        '<body style="' +

        'margin:0;' +
        'padding:32px 12px;' +
        'background:' +
        background +
        ';' +
        'color:' +
        color +
        ';' +
        'font-family:Arial,sans-serif;' +
        'text-align:center;' +
        'overflow:hidden;' +

        '">' +

        '<div style="' +
        'font-size:32px;' +
        'margin-bottom:6px;' +
        '">' +

        icon +

        '</div>' +

        '<div style="' +
        'font-size:21px;' +
        'font-weight:bold;' +
        '">' +

        escapeHtml(
          name
        ) +

        '</div>' +

        (
          cardId
            ?
            '<div style="' +
            'font-size:15px;' +
            'margin-top:5px;' +
            '">' +
            escapeHtml(
              cardId
            ) +
            '</div>'
            :
            ''
        ) +

        '<div style="' +
        'font-size:15px;' +
        'margin-top:10px;' +
        'font-weight:bold;' +
        '">' +

        escapeHtml(
          message
        ) +

        '</div>' +

        '</body>' +

        '</html>';

    }


    /* =====================================================
       HISTORIE
       ===================================================== */

    function getHistory() {

      try {

        const raw =
          sessionStorage.getItem(
            'attendanceHistory'
          );


        if (!raw) {

          return [];

        }


        const parsed =
          JSON.parse(
            raw
          );


        return Array.isArray(
          parsed
        )
          ? parsed
          : [];


      } catch (error) {

        return [];

      }

    }


    function saveHistory(
      history
    ) {

      try {

        sessionStorage.setItem(

          'attendanceHistory',

          JSON.stringify(
            history.slice(
              0,
              50
            )
          )

        );

      } catch (error) {}

    }


    function addScanToHistory(
      data
    ) {

      const history =
        getHistory();


      const now =
        new Date();


      const item = {

        time:
          now.toLocaleTimeString(
            'cs-CZ',
            {
              hour: '2-digit',
              minute: '2-digit'
            }
          ),

        cardId:
          String(
            data.cardId ||
            data.code ||
            ''
          ),

        name:
          String(
            data.name ||
            ''
          ),

        resultType:
          String(
            data.resultType ||
            ''
          ),

        success:
          !!data.success,

        method:
          String(
            data.method ||
            ''
          ),

        message:
          String(
            data.message ||
            ''
          )

      };


      history.unshift(
        item
      );


      saveHistory(
        history
      );


      renderHistory();

    }


    function renderHistory() {

      const history =
        getHistory();


      if (!history.length) {

        historyList.innerHTML =
          '<div style="' +
          'color:#888;' +
          'padding:5px 0;' +
          '">' +
          'Zatím žádné načtení.' +
          '</div>';


        return;

      }


      const newest =
        history.slice(
          0,
          5
        );


      const older =
        history.slice(
          5
        );


      let html =
        newest
          .map(
            historyRowHtml
          )
          .join('');


      if (
        older.length
      ) {

        html +=

          '<details>' +

          '<summary>' +

          'Starší načtení (' +
          older.length +
          ')' +

          '</summary>' +

          older
            .map(
              historyRowHtml
            )
            .join('') +

          '</details>';

      }


      historyList.innerHTML =
        html;

    }


    function historyRowHtml(
      item
    ) {

      let status =
        'Chyba';


      if (
        item.success &&
        item.resultType ===
        'new'
      ) {

        status =
          item.method ===
          'Ručně'
            ? 'Zapsáno ručně'
            : 'Zapsáno';

      }

      else if (
        item.resultType ===
        'duplicate'
      ) {

        status =
          'Už byl/a zapsán/a';

      }

      else if (
        item.message
      ) {

        status =
          item.message;

      }


      return (

        '<div class="historyRow">' +

          '<div class="historyTime">' +
            escapeHtml(
              item.time
            ) +
          '</div>' +

          '<div class="historyCard">' +
            escapeHtml(
              item.cardId || '—'
            ) +
          '</div>' +

          '<div class="historyName">' +

            escapeHtml(
              item.name || '—'
            ) +

            '<span class="historyStatus">' +
              escapeHtml(
                status
              ) +
            '</span>' +

          '</div>' +

        '</div>'

      );

    }


    /* =====================================================
       OBNOVA PŘEHLEDŮ AŽ PO CHVÍLI KLIDU
       ===================================================== */

    function scheduleOverviewRefresh() {

      if (
        overviewRefreshTimer
      ) {

        clearTimeout(
          overviewRefreshTimer
        );

      }


      overviewRefreshTimer =
        setTimeout(
          function() {

            try {

              refreshForm.submit();

            } catch (error) {}

          },
          7000
        );

    }


    /* =====================================================
       HTML ESCAPE
       ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ''
          : value
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    /* =====================================================
       TLAČÍTKA
       ===================================================== */

    testCameraButton
      .addEventListener(
        'click',
        startCameraTest
      );


    startDirectButton
      .addEventListener(
        'click',
        startDirectScanning
      );


    confirmCameraButton
      .addEventListener(
        'click',
        confirmTestedCamera
      );


    changeCameraButton
      .addEventListener(
        'click',
        changeCamera
      );


    cameraSelect
      .addEventListener(
        'change',
        function() {

          selectedCameraId =
            cameraSelect.value;

        }
      );


    /* =====================================================
       START
       ===================================================== */

    renderHistory();


    await loadCameras();


    /*
      Název lekce se obnoví každou minutu.
      Důležité: vždy používáme ?page=event,
      takže se sem už nemá načíst celý Rozcestník.
    */

    setInterval(
      function() {

        document
          .getElementById(
            'eventFrame'
          )
          .src =
            EVENT_PANEL_URL +
            '&t=' +
            Date.now();

      },
      60000
    );


  </script>

</body>

</html>
