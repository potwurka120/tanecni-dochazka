<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
    }

    h1 {
      text-align: center;
      margin: 6px 0 12px;
      font-size: 24px;
    }

    .camera-box {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .camera-title {
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .camera-info {
      text-align: center;
      color: #666;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    .confirm {
      display: none;
      background: #176b2c;
      color: white;
    }

    .reader-wrap {
      width: min(84vw, 320px);
      height: min(84vw, 320px);
      max-width: 320px;
      max-height: 320px;
      margin: 12px auto 0;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
    }

    #reader {
      width: 100%;
      height: 100%;
      background: #111;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #cameraMessage {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      background: #f5f5f5;
      line-height: 1.4;
    }

    .message-success {
      background: #dff3df !important;
      border: 2px solid #70b970;
    }

    .message-warning {
      background: #fff3cd !important;
      border: 2px solid #e0b400;
    }

    .message-error {
      background: #ffe5e5 !important;
      border: 2px solid #d66;
    }

    #scanStatus {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #fff3cd;
      border: 2px solid #e0b400;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
    }

    #scanResultFrame {
      width: 100%;
      min-height: 130px;
      border: 0;
      margin-top: 8px;
      background: transparent;
    }

    #panelContainer {
      display: none;
      margin-top: 8px;
    }

    #panelFrame {
      width: 100%;
      min-height: 1050px;
      border: none;
      display: block;
      background: #f3f3f3;
    }

    #bottomCameraControls {
      display: none;
      margin-top: 16px;
      padding-bottom: 35px;
    }

    .bottom-note {
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    #scanForm {
      display: none;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    💃 Taneční docházka
  </h1>

  <div class="camera-box">

    <div class="camera-title">
      📷 QR skener
    </div>

    <div id="setupControls">

      <div class="camera-info">

        Vyber kameru a naskenuj jednu
        kartičku nanečisto.

        <br><br>

        Test se do docházky nezapisuje.

      </div>

      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>

      <button
        class="primary"
        onclick="startCameraTest()">

        📷 Otestovat vybranou kameru

      </button>

    </div>

    <div class="reader-wrap">

      <div id="reader"></div>

    </div>

    <div id="cameraMessage">

      Čekám na výběr kamery.

    </div>

    <button
      id="confirmCameraButton"
      class="confirm"
      onclick="confirmCamera()">

      ✅ Tato kamera funguje – spustit docházku

    </button>

    <div id="scanStatus">
      ⏳ Zpracovávám...
    </div>

    <iframe
      id="scanResultFrame"
      name="scanResultFrame"
      srcdoc="
        <html>
        <body style='font-family:Arial;text-align:center;color:#777;padding:22px 5px;margin:0;'>
        Po spuštění docházky se zde zobrazí jméno.
        </body>
        </html>
      ">
    </iframe>

  </div>

  <div id="panelContainer">

    <iframe
      id="panelFrame"
      src="">
    </iframe>

  </div>

  <div id="bottomCameraControls">

    <div class="bottom-note">
      Pokud kamera špatně čte QR, můžeš tady udělat nový test.
    </div>

    <button
      class="secondary"
      onclick="changeCamera()">

      🔄 Změnit / znovu otestovat kameru

    </button>

  </div>

  <form
    id="scanForm"
    method="POST"
    target="scanResultFrame">

    <input
      type="hidden"
      name="action"
      value="scanPage">

    <input
      type="hidden"
      id="scanCode"
      name="code">

  </form>

</div>

<script>

// =====================================================
// SEM VLOŽ SVOU URL BEZ ?page=panel
// =====================================================

const WEBAPP_URL =
  'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec';

const PANEL_URL =
  WEBAPP_URL +
  '?page=panel';


// =====================================================
// PROMĚNNÉ
// =====================================================

let scanner = null;

let scanning = false;

let selectedCameraId = '';

let testMode = true;

let cameraTestSuccessful = false;

let attendanceMode = false;

let scannerBusy = false;

let pendingScan = false;

let lastCode = '';

let lastScanTime = 0;


// =====================================================
// ZVUK PO ROZPOZNÁNÍ QR
// =====================================================

function qrDetectedBeep() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContextClass) {
      return;
    }

    const ctx =
      new AudioContextClass();

    const osc =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    osc.connect(gain);

    gain.connect(
      ctx.destination
    );

    osc.frequency.value =
      900;

    osc.type =
      'sine';

    gain.gain.setValueAtTime(
      0.12,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      ctx.currentTime + 0.1
    );

    osc.start();

    osc.stop(
      ctx.currentTime + 0.1
    );

  } catch (error) {
  }

}


// =====================================================
// NAČÍST KAMERY
// =====================================================

async function loadCameras() {

  const select =
    document.getElementById(
      'cameraSelect'
    );

  const message =
    document.getElementById(
      'cameraMessage'
    );

  try {

    const cameras =
      await Html5Qrcode.getCameras();

    select.innerHTML = '';

    if (
      !cameras ||
      cameras.length === 0
    ) {

      message.className =
        'message-error';

      message.textContent =
        '❌ Nebyla nalezena žádná kamera.';

      return;

    }

    cameras.forEach(
      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          camera.id;

        option.textContent =
          (index + 1) +
          '. ' +
          (
            camera.label ||
            'Kamera'
          );

        select.appendChild(
          option
        );

      }
    );

    message.className = '';

    message.textContent =
      'Vyber kameru a spusť test.';

  } catch (error) {

    message.className =
      'message-error';

    message.textContent =
      '❌ Kamery se nepodařilo načíst: ' +
      error;

  }

}


// =====================================================
// TEST KAMERY
// =====================================================

async function startCameraTest() {

  const select =
    document.getElementById(
      'cameraSelect'
    );

  const message =
    document.getElementById(
      'cameraMessage'
    );

  selectedCameraId =
    select.value;

  if (!selectedCameraId) {

    message.className =
      'message-error';

    message.textContent =
      '❌ Nejdřív vyber kameru.';

    return;

  }

  await resetScanner();

  testMode =
    true;

  attendanceMode =
    false;

  cameraTestSuccessful =
    false;

  scannerBusy =
    false;

  pendingScan =
    false;

  lastCode =
    '';

  lastScanTime =
    0;

  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';

  message.className = '';

  message.textContent =
    '⏳ Spouštím kameru...';

  scanner =
    new Html5Qrcode(
      'reader'
    );

  try {

    // =================================================
    // NEJJEDNODUŠŠÍ KONFIGURACE
    // =================================================

    await scanner.start(

      selectedCameraId,

      {

        fps:
          10,

        qrbox: {

          width:
            240,

          height:
            240

        },

        disableFlip:
          false

      },

      onQrRead,

      function() {
        // chyby jednotlivých snímků ignorujeme
      }

    );

    scanning =
      true;

    message.className = '';

    message.textContent =
      '📷 Kamera běží. Dej celý QR kód do čtverce.';

  } catch (error) {

    scanning =
      false;

    message.className =
      'message-error';

    message.textContent =
      '❌ Kameru se nepodařilo spustit: ' +
      error;

  }

}


// =====================================================
// QR NALEZEN
// =====================================================

function onQrRead(
  decodedText,
  decodedResult
) {

  const code =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();

  if (!code) {
    return;
  }

  const now =
    Date.now();

  if (
    code === lastCode &&
    now - lastScanTime < 4000
  ) {

    return;

  }

  lastCode =
    code;

  lastScanTime =
    now;


  // =================================================
  // TEST
  // =================================================

  if (testMode) {

    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;

      qrDetectedBeep();

      const message =
        document.getElementById(
          'cameraMessage'
        );

      message.className =
        'message-success';

      message.innerHTML =
        '✅ QR přečteno správně' +
        '<br><br>' +
        '<strong style="font-size:30px;">' +
        code +
        '</strong>';

      document
        .getElementById(
          'confirmCameraButton'
        )
        .style.display =
          'block';

    }

    return;

  }


  // =================================================
  // OSTRÁ DOCHÁZKA
  // =================================================

  if (
    !attendanceMode ||
    scannerBusy
  ) {

    return;

  }

  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    return;

  }

  qrDetectedBeep();

  submitQr(
    code
  );

}


// =====================================================
// POTVRDIT KAMERU
// =====================================================

function confirmCamera() {

  if (!cameraTestSuccessful) {
    return;
  }

  if (
    WEBAPP_URL.includes(
      'SEM_VLOZ'
    )
  ) {

    alert(
      'Nejdřív vlož WEBAPP_URL.'
    );

    return;

  }

  testMode =
    false;

  attendanceMode =
    true;

  scannerBusy =
    false;

  pendingScan =
    false;

  lastCode =
    '';

  lastScanTime =
    0;

  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';

  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';

  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'block';

  document
    .getElementById(
      'bottomCameraControls'
    )
    .style.display =
      'block';

  const message =
    document.getElementById(
      'cameraMessage'
    );

  message.className =
    'message-success';

  message.textContent =
    '🟢 Ostré skenování zapnuto';

  const frame =
    document.getElementById(
      'scanResultFrame'
    );

  frame.srcdoc =
    '<html>' +
    '<body style="' +
    'font-family:Arial;' +
    'text-align:center;' +
    'margin:0;' +
    'padding:25px 5px;' +
    'font-weight:bold;' +
    'font-size:19px;' +
    'color:#176b2c;' +
    '">' +
    'Naskenuj první kartičku' +
    '</body>' +
    '</html>';

  refreshPanel();

}


// =====================================================
// ODESLAT QR
// =====================================================

function submitQr(code) {

  scannerBusy =
    true;

  pendingScan =
    true;

  const status =
    document.getElementById(
      'scanStatus'
    );

  status.style.display =
    'block';

  status.textContent =
    '⏳ Zpracovávám ' +
    code +
    '...';

  document
    .getElementById(
      'scanCode'
    )
    .value =
      code;

  const form =
    document.getElementById(
      'scanForm'
    );

  form.action =
    WEBAPP_URL;

  form.submit();

}


// =====================================================
// ODPOVĚĎ SE NAČETLA
// =====================================================

document
  .getElementById(
    'scanResultFrame'
  )
  .addEventListener(

    'load',

    function() {

      if (!pendingScan) {
        return;
      }

      pendingScan =
        false;

      scannerBusy =
        false;

      lastCode =
        '';

      lastScanTime =
        Date.now();

      document
        .getElementById(
          'scanStatus'
        )
        .style.display =
          'none';

      refreshPanel();

    }

  );


// =====================================================
// REFRESH PANELU
// =====================================================

function refreshPanel() {

  const frame =
    document.getElementById(
      'panelFrame'
    );

  frame.src =
    PANEL_URL +
    '&refresh=' +
    Date.now();

}


// =====================================================
// ZMĚNA KAMERY
// =====================================================

async function changeCamera() {

  attendanceMode =
    false;

  testMode =
    true;

  cameraTestSuccessful =
    false;

  scannerBusy =
    false;

  pendingScan =
    false;

  lastCode =
    '';

  lastScanTime =
    0;

  await resetScanner();

  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';

  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';

  const message =
    document.getElementById(
      'cameraMessage'
    );

  message.className = '';

  message.textContent =
    'Vyber kameru a spusť nový test.';

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });

}


// =====================================================
// RESET SKENERU
// =====================================================

async function resetScanner() {

  if (scanner) {

    if (scanning) {

      try {
        await scanner.stop();
      } catch (error) {
      }

    }

    try {
      scanner.clear();
    } catch (error) {
    }

  }

  scanner =
    null;

  scanning =
    false;

  const reader =
    document.getElementById(
      'reader'
    );

  reader.innerHTML =
    '';

}


// =====================================================
// START
// =====================================================

loadCameras();

</script>

</body>

</html>
