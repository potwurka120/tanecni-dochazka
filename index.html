<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>


  <script
    src="https://unpkg.com/html5-qrcode">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f3f3f3;

      color: #222;

    }


    .container {

      width: 100%;

      max-width: 680px;

      margin: auto;

      padding: 8px;

    }


    h1 {

      text-align: center;

      margin: 6px 0 12px;

      font-size: 24px;

    }


    .camera-box {

      background: white;

      border-radius: 16px;

      padding: 12px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);

    }


    .camera-title {

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .camera-info {

      text-align: center;

      color: #666;

      line-height: 1.4;

      margin-bottom: 12px;

    }


    select {

      width: 100%;

      padding: 12px;

      border-radius: 9px;

      border: 1px solid #ccc;

      background: white;

      font-size: 16px;

    }


    button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 14px;

      margin-top: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    .primary {

      background: #222;

      color: white;

    }


    .secondary {

      background: white;

      color: #222;

      border: 1px solid #ccc;

    }


    .confirm {

      display: none;

      background: #176b2c;

      color: white;

    }


    /* =========================================
       KAMERA – MALÝ ČTVEREC
       ========================================= */

    .reader-wrap {

      width: min(
        82vw,
        310px
      );

      height: min(
        82vw,
        310px
      );

      max-width: 310px;

      max-height: 310px;

      margin:
        12px auto 0;

      overflow: hidden;

      border-radius: 16px;

      background: #111;

    }


    #reader {

      width: 100%;

      height: 100%;

      background: #111;

    }


    #reader video {

      width: 100% !important;

      height: 100% !important;

      object-fit: cover !important;

    }


    /* =========================================
       VÝSLEDEK QR
       ========================================= */

    #scanResult {

      margin-top: 12px;

      padding: 16px;

      border-radius: 14px;

      text-align: center;

      background: #f5f5f5;

      min-height: 62px;

    }


    .result-name {

      font-size: 25px;

      font-weight: bold;

      margin-bottom: 5px;

    }


    .result-detail {

      font-size: 16px;

      line-height: 1.35;

    }


    .scan-success {

      background: #dff3df !important;

      border: 2px solid #70b970;

    }


    .scan-warning {

      background: #fff3cd !important;

      border: 2px solid #e0b400;

    }


    .scan-error {

      background: #ffe5e5 !important;

      border: 2px solid #d66;

    }


    #undoQrButton {

      display: none;

      background: white;

      color: #b22;

      border: 1px solid #c55;

    }


    /* =========================================
       PANEL
       ========================================= */

    #panelContainer {

      display: none;

      margin-top: 8px;

    }


    #panelFrame {

      width: 100%;

      min-height: 1150px;

      border: none;

      display: block;

      background: #f3f3f3;

    }


    /* =========================================
       KAMERA DOLŮ
       ========================================= */

    #bottomCameraControls {

      display: none;

      margin-top: 14px;

      padding-bottom: 30px;

    }


    .bottom-note {

      text-align: center;

      color: #777;

      font-size: 13px;

      margin-bottom: 4px;

    }


    /* =========================================
       SKRYTÝ BRIDGE
       ========================================= */

    #bridgeFrame {

      display: none;

      width: 0;

      height: 0;

      border: 0;

    }


    #bridgeForm {

      display: none;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka 25
  </h1>


  <div class="camera-box">


    <div class="camera-title">
      📷 QR skener
    </div>


    <!-- ======================================= -->
    <!-- PRVNÍ TEST -->
    <!-- ======================================= -->

    <div id="setupControls">


      <div class="camera-info">

        Vyber kameru, která dobře ostří
        na malý QR kód.

        <br><br>

        Naskenuj jednu kartičku nanečisto.
        Test se do docházky nezapíše.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        class="primary"
        onclick="startCameraTest()">

        📷 Otestovat vybranou kameru

      </button>

    </div>


    <!-- ======================================= -->
    <!-- MALÁ ČTVERCOVÁ KAMERA -->
    <!-- ======================================= -->

    <div class="reader-wrap">

      <div id="reader">
      </div>

    </div>


    <!-- ======================================= -->
    <!-- VÝSLEDEK -->
    <!-- ======================================= -->

    <div id="scanResult">

      <div
        id="scanResultName"
        class="result-name">

        Čekám na kameru...

      </div>


      <div
        id="scanResultDetail"
        class="result-detail">
      </div>

    </div>


    <button
      id="confirmCameraButton"
      class="confirm"
      onclick="confirmCamera()">

      ✅ Tato kamera funguje – spustit docházku

    </button>


    <button
      id="undoQrButton"
      onclick="undoQrAttendance()">

      ✖ Zrušit tento QR zápis

    </button>


  </div>


  <!-- ========================================= -->
  <!-- PANEL -->
  <!-- ========================================= -->

  <div id="panelContainer">

    <iframe
      id="panelFrame"
      src="">
    </iframe>

  </div>


  <!-- ========================================= -->
  <!-- ZMĚNA KAMERY – ÚPLNĚ DOLE -->
  <!-- ========================================= -->

  <div id="bottomCameraControls">


    <div class="bottom-note">

      Tuto volbu potřebuješ jen tehdy,
      když kamera špatně ostří.

    </div>


    <button
      class="secondary"
      onclick="changeCamera()">

      🔄 Změnit / znovu otestovat kameru

    </button>

  </div>


  <!-- ========================================= -->
  <!-- SKRYTÝ BRIDGE -->
  <!-- ========================================= -->

  <iframe
    id="bridgeFrame"
    name="bridgeFrame">
  </iframe>


  <form
    id="bridgeForm"
    method="POST"
    target="bridgeFrame">

    <input
      type="hidden"
      id="bridgeAction"
      name="action">

    <input
      type="hidden"
      id="bridgeToken"
      name="token">

    <input
      type="hidden"
      id="bridgeCode"
      name="code">

    <input
      type="hidden"
      id="bridgeRecordId"
      name="recordId">

  </form>


</div>


<script>


// =====================================================
// SEM VLOŽ ADRESU WEB APP
//
// BEZ ?page=panel
// =====================================================

const WEBAPP_URL =
  'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec?page=panel';


// =====================================================
// PANEL URL
// =====================================================

const PANEL_URL =
  WEBAPP_URL +
  '?page=panel';


// =====================================================
// PROMĚNNÉ
// =====================================================

let scanner =
  null;


let scanning =
  false;


let selectedCameraId =
  '';


let testMode =
  true;


let cameraTestSuccessful =
  false;


let attendanceMode =
  false;


let scannerBusy =
  false;


let bridgeToken =
  '';


let pendingStartAttendance =
  false;


let lastCode =
  '';


let lastScanTime =
  0;


let lastUndoRecord =
  null;


// =====================================================
// NAČTENÍ KAMER
// =====================================================

async function loadCameras() {

  const select =
    document
      .getElementById(
        'cameraSelect'
      );


  try {

    const cameras =
      await Html5Qrcode
        .getCameras();


    select.innerHTML =
      '';


    if (
      !cameras ||
      cameras.length === 0
    ) {

      showScannerMessage(

        '❌ Kamera nenalezena',

        'Telefon neposkytl žádnou kameru.',

        'error'

      );


      return;

    }


    cameras.forEach(

      function(camera, index) {

        const option =
          document
            .createElement(
              'option'
            );


        option.value =
          camera.id;


        option.textContent =
          camera.label ||
          (
            'Kamera ' +
            (index + 1)
          );


        select.appendChild(
          option
        );

      }

    );


    showScannerMessage(

      '📷 Vyber kameru',

      'Potom spusť test QR kódu.',

      ''

    );


  } catch (error) {

    showScannerMessage(

      '❌ Chyba kamery',

      String(error),

      'error'

    );

  }

}


// =====================================================
// TEST KAMERY
// =====================================================

async function startCameraTest() {

  const select =
    document
      .getElementById(
        'cameraSelect'
      );


  selectedCameraId =
    select.value;


  if (!selectedCameraId) {

    return;

  }


  await stopScanner();


  testMode =
    true;


  attendanceMode =
    false;


  cameraTestSuccessful =
    false;


  scannerBusy =
    false;


  clearUndoQr();


  lastCode =
    '';


  lastScanTime =
    0;


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  showScannerMessage(

    '⏳ Spouštím kameru...',

    '',

    ''

  );


  scanner =
    new Html5Qrcode(
      'reader'
    );


  try {

    await scanner.start(

      {
        deviceId: {
          exact:
            selectedCameraId
        }
      },

      {

        fps:
          15,


        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.floor(

                Math.min(
                  width,
                  height
                ) * 0.80

              );


            return {

              width:
                size,

              height:
                size

            };

          },


        videoConstraints: {

          deviceId: {
            exact:
              selectedCameraId
          },

          width: {
            ideal:
              1920
          },

          height: {
            ideal:
              1080
          },

          frameRate: {
            ideal:
              30
          }

        }

      },

      onQrRead,

      function() {

        // Nepřečtené snímky ignorujeme.

      }

    );


    scanning =
      true;


    showScannerMessage(

      '📷 Test kamery',

      'Naskenuj jednu kartičku nanečisto.',

      ''

    );


  } catch (error) {

    scanning =
      false;


    showScannerMessage(

      '❌ Kameru se nepodařilo spustit',

      String(error),

      'error'

    );

  }

}


// =====================================================
// QR PŘEČTEN
// =====================================================

function onQrRead(decodedText) {

  const code =
    String(
      decodedText || ''
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  if (
    code === lastCode &&
    now - lastScanTime < 2500
  ) {

    return;

  }


  lastCode =
    code;


  lastScanTime =
    now;


  // =================================================
  // TEST
  // =================================================

  if (
    testMode
  ) {

    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;


      showScannerMessage(

        '✅ Kamera funguje',

        'Přečteno: ' +
        code,

        'success'

      );


      document
        .getElementById(
          'confirmCameraButton'
        )
        .style.display =
          'block';

    } else {

      showScannerMessage(

        '⚠️ QR přečten',

        'Obsah QR: ' +
        code,

        'warning'

      );

    }


    return;

  }


  // =================================================
  // OSTRÁ DOCHÁZKA
  // =================================================

  if (
    !attendanceMode ||
    scannerBusy
  ) {

    return;

  }


  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    showScannerMessage(

      '❌ Neplatný QR kód',

      code,

      'error'

    );


    return;

  }


  if (!bridgeToken) {

    scannerBusy =
      true;


    showScannerMessage(

      '⏳ Obnovuji spojení...',

      'Počkej okamžik.',

      'warning'

    );


    requestBridgeSession();


    return;

  }


  submitQr(
    code
  );

}


// =====================================================
// POTVRDIT KAMERU
// =====================================================

function confirmCamera() {

  if (
    !cameraTestSuccessful
  ) {

    return;

  }


  if (
    WEBAPP_URL.includes(
      'SEM_VLOZ'
    )
  ) {

    alert(
      'Nejdřív vlož svoji WEBAPP_URL do index.html.'
    );

    return;

  }


  testMode =
    false;


  attendanceMode =
    false;


  scannerBusy =
    true;


  pendingStartAttendance =
    true;


  clearUndoQr();


  lastCode =
    '';


  lastScanTime =
    0;


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  document
    .getElementById(
      'panelContainer'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'bottomCameraControls'
    )
    .style.display =
      'block';


  refreshPanel();


  showScannerMessage(

    '⏳ Připravuji docházku...',

    'Kamera už je připravená.',

    'warning'

  );


  requestBridgeSession();

}


// =====================================================
// BRIDGE RELACE
// =====================================================

function requestBridgeSession() {

  const frame =
    document
      .getElementById(
        'bridgeFrame'
      );


  frame.src =

    WEBAPP_URL +

    '?page=bridgeSession' +

    '&t=' +

    Date.now();

}


// =====================================================
// ODESLAT QR
// =====================================================

function submitQr(code) {

  scannerBusy =
    true;


  clearUndoQr();


  showScannerMessage(

    '⏳ Zpracovávám ' +
    code,

    'Kontroluji kartičku a docházku...',

    'warning'

  );


  document
    .getElementById(
      'bridgeAction'
    )
    .value =
      'bridgeScan';


  document
    .getElementById(
      'bridgeToken'
    )
    .value =
      bridgeToken;


  document
    .getElementById(
      'bridgeCode'
    )
    .value =
      code;


  document
    .getElementById(
      'bridgeRecordId'
    )
    .value =
      '';


  const form =
    document
      .getElementById(
        'bridgeForm'
      );


  form.action =
    WEBAPP_URL;


  form.submit();

}


// =====================================================
// VÝSLEDEK QR
// =====================================================

function handleScanResult(result) {

  scannerBusy =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  if (!result) {

    showScannerMessage(

      '❌ Chyba',

      'Server neposlal odpověď.',

      'error'

    );


    return;

  }


  if (
    result.type ===
    'sessionExpired'
  ) {

    bridgeToken =
      '';


    showScannerMessage(

      '⏳ Obnovuji spojení...',

      'Zkus kartičku znovu za okamžik.',

      'warning'

    );


    requestBridgeSession();


    return;

  }


  if (
    result.success &&
    result.type === 'new'
  ) {

    showScannerMessage(

      '✅ ' +
      result.name,

      'Zapsán/a do docházky',

      'success'

    );


    if (
      result.undoRecord
    ) {

      lastUndoRecord =
        result.undoRecord;


      document
        .getElementById(
          'undoQrButton'
        )
        .style.display =
          'block';

    }


    refreshPanel();


    return;

  }


  if (
    result.success &&
    result.type === 'duplicate'
  ) {

    showScannerMessage(

      '⚠️ ' +
      result.name,

      'Už je zapsán/a do této lekce',

      'warning'

    );


    return;

  }


  if (
    result.type ===
    'inactiveCard'
  ) {

    showScannerMessage(

      '🚫 ' +
      (
        result.name ||
        result.id
      ),

      'Kartička je ukončená. Docházka nebyla zapsána.',

      'error'

    );


    return;

  }


  if (
    result.type ===
    'unknown'
  ) {

    showScannerMessage(

      '❌ ' +
      result.id,

      'Kartička nebyla nalezena v Účastnících.',

      'error'

    );


    return;

  }


  if (
    result.type ===
    'busy'
  ) {

    showScannerMessage(

      '⏳ Zkus kartičku znovu',

      result.message,

      'warning'

    );


    return;

  }


  showScannerMessage(

    '❌ Nelze zapsat',

    result.message ||
    'Neznámá chyba.',

    'error'

  );

}


// =====================================================
// ZRUŠIT POSLEDNÍ QR ZÁPIS
// =====================================================

function undoQrAttendance() {

  if (
    !lastUndoRecord ||
    !lastUndoRecord.recordId
  ) {

    return;

  }


  const confirmed =
    confirm(

      'Opravdu odstranit tento QR zápis z docházky?\n\n' +

      'Potom bude možné účastníka zapsat znovu.'

    );


  if (!confirmed) {

    return;

  }


  scannerBusy =
    true;


  showScannerMessage(

    '⏳ Ruším zápis...',

    lastUndoRecord.name || '',

    'warning'

  );


  document
    .getElementById(
      'bridgeAction'
    )
    .value =
      'bridgeUndo';


  document
    .getElementById(
      'bridgeToken'
    )
    .value =
      bridgeToken;


  document
    .getElementById(
      'bridgeCode'
    )
    .value =
      '';


  document
    .getElementById(
      'bridgeRecordId'
    )
    .value =
      lastUndoRecord.recordId;


  const form =
    document
      .getElementById(
        'bridgeForm'
      );


  form.action =
    WEBAPP_URL;


  form.submit();

}


// =====================================================
// VÝSLEDEK SMAZÁNÍ
// =====================================================

function handleUndoResult(result) {

  scannerBusy =
    false;


  clearUndoQr();


  if (
    result &&
    result.success
  ) {

    showScannerMessage(

      '🗑️ Zápis zrušen',

      result.name +
      ' byl/a odstraněn/a z docházky.',

      'warning'

    );


    refreshPanel();


    return;

  }


  showScannerMessage(

    '❌ Zápis se nepodařilo zrušit',

    result
      ? result.message
      : 'Neznámá chyba.',

    'error'

  );

}


// =====================================================
// ZPRÁVY Z APPS SCRIPT BRIDGE
// =====================================================

window.addEventListener(

  'message',

  function(event) {

    if (!event.data) {

      return;

    }


    if (
      event.data.type ===
      'bridge-session'
    ) {

      bridgeToken =
        String(
          event.data.token || ''
        );


      if (!bridgeToken) {

        return;

      }


      scannerBusy =
        false;


      if (
        pendingStartAttendance
      ) {

        pendingStartAttendance =
          false;


        attendanceMode =
          true;


        showScannerMessage(

          '🟢 Připraveno',

          'Naskenuj první kartičku.',

          'success'

        );

      }


      return;

    }


    if (
      event.data.type ===
      'bridge-scan-result'
    ) {

      handleScanResult(
        event.data.result
      );


      return;

    }


    if (
      event.data.type ===
      'bridge-undo-result'
    ) {

      handleUndoResult(
        event.data.result
      );


      return;

    }

  }

);


// =====================================================
// OBNOVIT PANEL
// =====================================================

function refreshPanel() {

  const frame =
    document
      .getElementById(
        'panelFrame'
      );


  frame.src =

    PANEL_URL +

    '&refresh=' +

    Date.now();

}


// =====================================================
// ZMĚNIT KAMERU
// =====================================================

async function changeCamera() {

  attendanceMode =
    false;


  scannerBusy =
    false;


  pendingStartAttendance =
    false;


  testMode =
    true;


  cameraTestSuccessful =
    false;


  clearUndoQr();


  lastCode =
    '';


  lastScanTime =
    0;


  await stopScanner();


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'confirmCameraButton'
    )
    .style.display =
      'none';


  showScannerMessage(

    '📷 Vyber kameru',

    'Proveď nový test QR kódu.',

    ''

  );


  window.scrollTo({

    top:
      0,

    behavior:
      'smooth'

  });

}


// =====================================================
// ZASTAVIT KAMERU
// =====================================================

async function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    await scanner.stop();

  } catch (error) {

    // Ignorujeme.

  }


  try {

    scanner.clear();

  } catch (error) {

    // Ignorujeme.

  }


  scanning =
    false;

}


// =====================================================
// VÝPIS STAVU
// =====================================================

function showScannerMessage(
  name,
  detail,
  type
) {

  const box =
    document
      .getElementById(
        'scanResult'
      );


  box.className =
    '';


  if (
    type === 'success'
  ) {

    box.classList.add(
      'scan-success'
    );

  }


  if (
    type === 'warning'
  ) {

    box.classList.add(
      'scan-warning'
    );

  }


  if (
    type === 'error'
  ) {

    box.classList.add(
      'scan-error'
    );

  }


  document
    .getElementById(
      'scanResultName'
    )
    .textContent =
      name;


  document
    .getElementById(
      'scanResultDetail'
    )
    .textContent =
      detail;

}


// =====================================================
// CLEAR QR UNDO
// =====================================================

function clearUndoQr() {

  lastUndoRecord =
    null;


  document
    .getElementById(
