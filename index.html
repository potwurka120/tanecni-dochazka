<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Taneční docházka</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f3f3f3;
      color: #222;
      font-family: Arial, sans-serif;
    }

    body {
      padding-bottom: env(safe-area-inset-bottom);
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 8px;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin: 5px 0 10px;
    }


    /* =================================================
       KAMERA
       ================================================= */

    .camera-box {
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .camera-title {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .camera-info {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
    }

    button,
    .link-button {
      display: block;
      width: 100%;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    button {
      border: none;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    .home-button {
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }


    /* =================================================
       POTVRZENÍ KAMERY
       ================================================= */

    #confirmCameraButton {
      display: none;
      background: #176b2c;
      color: white;
      font-size: 18px;
      padding: 16px;
    }

    #confirmCameraButton.visible {
      display: block;
    }


    /* =================================================
       VIDEO
       ================================================= */

    .video-box {
      position: relative;

      width: min(86vw, 330px);
      max-width: 330px;

      aspect-ratio: 1 / 1;

      margin: 10px auto 0;

      overflow: hidden;

      border-radius: 16px;

      background: #111;
    }

    #qr-video {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* QR scanner overlay */

    .scan-region-highlight {
      border-radius: 14px !important;
    }

    .code-outline-highlight {
      stroke: #27b54a !important;
      stroke-width: 5 !important;
      stroke-dasharray: none !important;
    }


    /* =================================================
       STAV KAMERY
       ================================================= */

    #cameraMessage {
      margin-top: 10px;
      padding: 12px;
      border-radius: 11px;
      background: #f5f5f5;
      text-align: center;
      line-height: 1.4;
    }

    .success {
      background: #dff3df !important;
      border: 2px solid #70b970;
    }

    .warning {
      background: #fff3cd !important;
      border: 2px solid #e0b400;
    }

    .error {
      background: #ffe5e5 !important;
      border: 2px solid #d66;
    }

    .big-code {
      display: block;
      font-size: 32px;
      font-weight: bold;
      margin-top: 6px;
    }


    /* =================================================
       ZPRACOVÁVÁM
       ================================================= */

    #scanStatus {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 11px;
      background: #fff3cd;
      border: 2px solid #e0b400;
      text-align: center;
      font-weight: bold;
    }


    /* =================================================
       POSLEDNÍ VÝSLEDEK
       ================================================= */

    .result-box {
      margin-top: 10px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.08);
    }

    .result-label {
      padding: 10px 13px 0;
      font-size: 12px;
      color: #777;
      font-weight: bold;
      letter-spacing: 0.4px;
    }

    #scanResultFrame {
      width: 100%;
      min-height: 135px;
      border: none;
      display: block;
      background: transparent;
    }


    /* =================================================
       DOOR PANEL
       Poslední lidé + ruční zápis
       ================================================= */

    #doorContainer {
      display: none;
      margin-top: 10px;
    }

    #doorFrame {
      width: 100%;
      min-height: 720px;
      border: none;
      display: block;
      background: #f3f3f3;
    }


    /* =================================================
       SPODNÍ OVLÁDÁNÍ
       ================================================= */

    #bottomControls {
      display: none;
      margin-top: 12px;
      padding-bottom: 30px;
    }

    .bottom-note {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 6px;
    }


    /* =================================================
       SKRYTÉ FORMULÁŘE
       ================================================= */

    #scanForm,
    #overviewForm,
    #overviewFrame {
      display: none;
    }


    @media (max-width: 450px) {

      .container {
        padding: 6px;
      }

      h1 {
        font-size: 22px;
      }

      .video-box {
        width: min(88vw, 320px);
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    💃 Taneční docházka
  </h1>


  <!-- =================================================
       QR KAMERA
       ================================================= -->

  <div class="camera-box">


    <div class="camera-title">
      📷 Odbavování u dveří
    </div>


    <!-- ===============================================
         PRVNÍ NASTAVENÍ KAMERY
         =============================================== -->

    <div id="setupControls">


      <div class="camera-info">

        Vyber kameru a naskenuj jednu kartičku nanečisto.

        <br>

        Test se do docházky nezapíše.

      </div>


      <select id="cameraSelect">

        <option value="">
          Načítám kamery...
        </option>

      </select>


      <button
        id="testCameraButton"
        class="primary">

        📷 Otestovat vybranou kameru

      </button>


    </div>


    <!-- ===============================================
         VIDEO
         =============================================== -->

    <div class="video-box">

      <video
        id="qr-video"
        playsinline
        muted>
      </video>

    </div>


    <!-- ===============================================
         STAV
         =============================================== -->

    <div id="cameraMessage">

      Čekám na výběr kamery.

    </div>


    <button id="confirmCameraButton">

      ✅ Kamera funguje – spustit docházku

    </button>


    <div id="scanStatus">

      ⏳ Zpracovávám...

    </div>


  </div>


  <!-- =================================================
       POSLEDNÍ NAČTENÝ ČLOVĚK
       ================================================= -->

  <div class="result-box">


    <div class="result-label">
      POSLEDNÍ NAČTENÍ
    </div>


    <iframe
      id="scanResultFrame"
      name="scanResultFrame"
      srcdoc="
        <html>
        <body style='
          margin:0;
          padding:28px 8px;
          font-family:Arial,sans-serif;
          text-align:center;
          color:#777;
        '>
          Po spuštění docházky se zde zobrazí jméno.
        </body>
        </html>
      ">
    </iframe>


  </div>


  <!-- =================================================
       POSLEDNÍ ODBAVENÍ + RUČNÍ ZÁPIS
       ================================================= -->

  <div id="doorContainer">

    <iframe
      id="doorFrame"
      src="">
    </iframe>

  </div>


  <!-- =================================================
       ÚPLNĚ DOLE
       ================================================= -->

  <div id="bottomControls">


    <a
      id="homeLink"
      class="link-button home-button"
      href="#">

      ← Zpět na hlavní stránku

    </a>


    <button
      id="changeCameraButton"
      class="secondary">

      📷 Změnit / znovu otestovat kameru

    </button>


    <div class="bottom-note">

      Změnu kamery používej jen tehdy,
      pokud současná kamera špatně čte kartičky.

    </div>


  </div>


  <!-- =================================================
       FORMULÁŘ QR
       ================================================= -->

  <form
    id="scanForm"
    method="POST"
    target="scanResultFrame">


    <!--
      NOVÝ Code.gs používá action = scan
    -->

    <input
      type="hidden"
      name="action"
      value="scan">


    <input
      type="hidden"
      id="scanCode"
      name="code">


  </form>


  <!-- =================================================
       TABULKOVÉ PŘEHLEDY
       Aktualizují se až po pauze.
       ================================================= -->

  <iframe
    id="overviewFrame"
    name="overviewFrame">
  </iframe>


  <form
    id="overviewForm"
    method="POST"
    target="overviewFrame">

    <input
      type="hidden"
      name="action"
      value="refreshOverviews">

  </form>


</div>


<script type="module">


// =====================================================
// QR SCANNER
//
// Tohle je knihovna, která ti fungovala.
// NEMĚNÍME.
// =====================================================

import QrScanner
  from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


// =====================================================
// TVOJE APPS SCRIPT URL
//
// SEM VLOŽ /exec URL.
// BEZ ?page=...
// =====================================================

const WEBAPP_URL =
  'https://script.google.com/macros/s/AKfycbz4AAoQh6esrTyXvW2YWtp_peuvgYWoGmAlYinO5Q-waWqyHiWqvQh_dpCyMmlHQ_uE/exec';


// =====================================================
// NOVÁ ARCHITEKTURA
// =====================================================

const DOOR_PANEL_URL =
  WEBAPP_URL +
  '?page=door';


const HOME_URL =
  WEBAPP_URL;


// =====================================================
// ELEMENTY
// =====================================================

const video =
  document.getElementById(
    'qr-video'
  );


const cameraSelect =
  document.getElementById(
    'cameraSelect'
  );


const cameraMessage =
  document.getElementById(
    'cameraMessage'
  );


const testCameraButton =
  document.getElementById(
    'testCameraButton'
  );


const confirmCameraButton =
  document.getElementById(
    'confirmCameraButton'
  );


const changeCameraButton =
  document.getElementById(
    'changeCameraButton'
  );


const resultFrame =
  document.getElementById(
    'scanResultFrame'
  );


const doorFrame =
  document.getElementById(
    'doorFrame'
  );


// =====================================================
// ODKAZ ZPĚT NA HOME
// =====================================================

document
  .getElementById(
    'homeLink'
  )
  .href =
    HOME_URL;


// =====================================================
// STAV
// =====================================================

let selectedCameraId =
  '';


let testMode =
  true;


let attendanceMode =
  false;


let cameraTestSuccessful =
  false;


let scannerBusy =
  false;


let pendingScan =
  false;


let lastCode =
  '';


let lastScanTime =
  0;


let overviewRefreshTimer =
  null;


// =====================================================
// AUDIO
// =====================================================

let audioContext =
  null;


function prepareAudio() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContextClass) {

      return;

    }


    if (!audioContext) {

      audioContext =
        new AudioContextClass();

    }


    if (
      audioContext.state ===
      'suspended'
    ) {

      audioContext.resume();

    }

  }

  catch (error) {

  }

}


// =====================================================
// PÍPNUTÍ
// =====================================================

function beep(
  frequency,
  duration
) {

  try {

    if (!audioContext) {

      return;

    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      frequency;


    const now =
      audioContext.currentTime;


    gain.gain.setValueAtTime(
      0.16,
      now
    );


    gain.gain
      .exponentialRampToValueAtTime(
        0.001,
        now + duration
      );


    oscillator.start(
      now
    );


    oscillator.stop(
      now + duration
    );

  }

  catch (error) {

  }

}


// =====================================================
// SKENER
// =====================================================

const scanner =
  new QrScanner(

    video,

    function(scanResult) {

      processQr(
        scanResult
      );

    },

    {

      returnDetailedScanResult:
        true,

      highlightScanRegion:
        true,

      highlightCodeOutline:
        true,

      maxScansPerSecond:
        12,

      preferredCamera:
        'environment'

    }

  );


// =====================================================
// NAČTENÍ KAMER
// =====================================================

async function loadCameras() {

  try {

    cameraMessage.className =
      '';


    cameraMessage.textContent =
      '⏳ Povol kameru...';


    // Krátce otevřeme kameru,
    // aby prohlížeč zpřístupnil názvy objektivů.

    await scanner.start();


    const cameras =
      await QrScanner.listCameras(
        true
      );


    scanner.stop();


    cameraSelect.innerHTML =
      '';


    if (
      !cameras ||
      cameras.length === 0
    ) {

      cameraMessage.className =
        'error';


      cameraMessage.textContent =
        '❌ Nebyla nalezena žádná kamera.';


      return;

    }


    cameras.forEach(

      function(
        camera,
        index
      ) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.id;


        option.textContent =

          (index + 1) +

          '. ' +

          (
            camera.label ||
            'Kamera'
          );


        cameraSelect.appendChild(
          option
        );

      }

    );


    // =================================================
    // POSLEDNÍ FUNKČNÍ KAMERA NA TOMTO TELEFONU
    // =================================================

    try {

      const savedCameraId =
        localStorage.getItem(
          'attendanceCameraId'
        );


      if (savedCameraId) {

        const exists =
          Array.from(
            cameraSelect.options
          )
          .some(

            option =>
              option.value ===
              savedCameraId

          );


        if (exists) {

          cameraSelect.value =
            savedCameraId;

        }

      }

    }

    catch (error) {

    }


    cameraMessage.className =
      '';


    cameraMessage.textContent =
      'Vyber kameru a spusť test.';

  }

  catch (error) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =

      '❌ Kameru se nepodařilo připravit: ' +

      error;

  }

}


// =====================================================
// TEST VYBRANÉ KAMERY
// =====================================================

async function startSelectedCamera() {

  prepareAudio();


  selectedCameraId =
    cameraSelect.value;


  if (!selectedCameraId) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =
      '❌ Nejdřív vyber kameru.';


    return;

  }


  testMode =
    true;


  attendanceMode =
    false;


  cameraTestSuccessful =
    false;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  try {

    scanner.stop();


    await scanner.setCamera(
      selectedCameraId
    );


    await scanner.start();


    cameraMessage.className =
      '';


    cameraMessage.textContent =
      '📷 Kamera běží. Naskenuj testovací kartičku.';

  }

  catch (error) {

    cameraMessage.className =
      'error';


    cameraMessage.textContent =

      '❌ Kameru se nepodařilo spustit: ' +

      error;

  }

}


// =====================================================
// QR PŘEČTEN
// =====================================================

function processQr(
  scanResult
) {

  const code =
    String(

      scanResult &&
      scanResult.data
        ? scanResult.data
        : ''

    )
      .trim()
      .toUpperCase();


  if (!code) {

    return;

  }


  const now =
    Date.now();


  // qr-scanner může stejný kód přečíst
  // mnohokrát za sekundu.

  if (
    code === lastCode &&
    now - lastScanTime < 2500
  ) {

    return;

  }


  lastCode =
    code;


  lastScanTime =
    now;


  // =================================================
  // TEST KAMERY
  // =================================================

  if (testMode) {

    if (
      /^[MF]\d+$/.test(
        code
      )
    ) {

      cameraTestSuccessful =
        true;


      beep(
        760,
        0.10
      );


      cameraMessage.className =
        'success';


      cameraMessage.innerHTML =

        '✅ Kamera funguje' +

        '<span class="big-code">' +

        escapeHtml(
          code
        ) +

        '</span>' +

        '<br>' +

        'Klikni na zelené tlačítko.';


      confirmCameraButton
        .classList
        .add(
          'visible'
        );


      return;

    }


    cameraMessage.className =
      'warning';


    cameraMessage.innerHTML =

      '⚠️ QR byl přečten, ale nemá správný formát.' +

      '<span class="big-code">' +

      escapeHtml(
        code
      ) +

      '</span>';


    return;

  }


  // =================================================
  // OSTRÁ DOCHÁZKA
  // =================================================

  if (
    !attendanceMode ||
    scannerBusy
  ) {

    return;

  }


  if (
    !/^[MF]\d+$/.test(
      code
    )
  ) {

    return;

  }


  submitQr(
    code
  );

}


// =====================================================
// TEST PROŠEL -> SPUSTIT DOCHÁZKU
// =====================================================

function confirmCamera() {

  prepareAudio();


  if (
    !cameraTestSuccessful
  ) {

    return;

  }


  if (
    !WEBAPP_URL ||
    WEBAPP_URL ===
      'MUJWEBAPPURL'
  ) {

    alert(
      'Nejdřív vlož svoji Apps Script WEBAPP_URL.'
    );


    return;

  }


  // =================================================
  // ULOŽÍME FUNKČNÍ KAMERU NA TOMTO TELEFONU
  // =================================================

  try {

    localStorage.setItem(

      'attendanceCameraId',

      selectedCameraId

    );

  }

  catch (error) {

  }


  // =================================================
  // DŮLEŽITÉ:
  //
  // KAMERA SE NEVYPÍNÁ.
  // KAMERA SE NERESTARTUJE.
  //
  // Jen TEST -> OSTRÁ DOCHÁZKA.
  // =================================================

  testMode =
    false;


  attendanceMode =
    true;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'none';


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  cameraMessage.className =
    'success';


  cameraMessage.innerHTML =

    '🟢 <strong>Docházka je spuštěná</strong>' +

    '<br>' +

    'Naskenuj první kartičku.';


  document
    .getElementById(
      'doorContainer'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'bottomControls'
    )
    .style.display =
      'block';


  // DoorPanel načítáme pouze jednou.

  loadDoorPanel();


  resultFrame.srcdoc =

    '<html>' +

    '<body style="' +

    'margin:0;' +

    'padding:28px 8px;' +

    'font-family:Arial,sans-serif;' +

    'font-weight:bold;' +

    'font-size:19px;' +

    'text-align:center;' +

    'color:#176b2c;' +

    '">' +

    'Naskenuj první kartičku' +

    '</body>' +

    '</html>';

}


// =====================================================
// NAČÍST DOOR PANEL
// =====================================================

function loadDoorPanel() {

  doorFrame.src =

    DOOR_PANEL_URL +

    '&v=' +

    Date.now();

}


// =====================================================
// ODESLAT QR DO APPS SCRIPTU
// =====================================================

function submitQr(
  code
) {

  scannerBusy =
    true;


  pendingScan =
    true;


  // Pokud se čekalo na přepočítání
  // tabulkového Přehledu, QR má přednost.

  cancelOverviewRefresh();


  const status =
    document.getElementById(
      'scanStatus'
    );


  status.style.display =
    'block';


  status.textContent =

    '⏳ Zpracovávám ' +

    code +

    '...';


  document
    .getElementById(
      'scanCode'
    )
    .value =
      code;


  const form =
    document.getElementById(
      'scanForm'
    );


  form.action =
    WEBAPP_URL;


  form.submit();

}


// =====================================================
// SERVER POSLAL POSTMESSAGE
//
// Nový Code.gs posílá:
// type = attendance-result
// =====================================================

window.addEventListener(

  'message',

  function(event) {

    if (
      !event.data ||
      event.data.type !==
        'attendance-result'
    ) {

      return;

    }


    finishScan();


    // =================================================
    // OBNOVÍME JEN SEZNAM U DVEŘÍ
    //
    // Žádné statistiky.
    // Žádní chybějící.
    // Žádný reload celé stránky.
    // =================================================

    try {

      if (
        doorFrame &&
        doorFrame.contentWindow
      ) {

        doorFrame
          .contentWindow
          .postMessage(

            {
              type:
                'refresh-door-panel'
            },

            '*'

          );

      }

    }

    catch (error) {

    }


    // Přehledy v TABULCE až po pauze.

    scheduleOverviewRefresh();

  }

);


// =====================================================
// ZÁLOŽNÍ ODEMKNUTÍ SKENERU
//
// Pokud by mobil postMessage nepředal,
// load iframe stejně povolí další QR.
// =====================================================

resultFrame.addEventListener(

  'load',

  function() {

    if (!pendingScan) {

      return;

    }


    setTimeout(

      function() {

        if (
          pendingScan
        ) {

          finishScan();

          scheduleOverviewRefresh();

        }

      },

      150

    );

  }

);


// =====================================================
// DOKONČENÍ JEDNOHO SKENU
// =====================================================

function finishScan() {

  if (!pendingScan) {

    return;

  }


  pendingScan =
    false;


  scannerBusy =
    false;


  lastCode =
    '';


  lastScanTime =
    Date.now();


  document
    .getElementById(
      'scanStatus'
    )
    .style.display =
      'none';


  beep(
    920,
    0.11
  );

}


// =====================================================
// TABULKOVÉ PŘEHLEDY
//
// Až když je u dveří chvíli klid.
// =====================================================

function scheduleOverviewRefresh() {

  cancelOverviewRefresh();


  overviewRefreshTimer =
    setTimeout(

      function() {

        overviewRefreshTimer =
          null;


        if (
          scannerBusy
        ) {

          scheduleOverviewRefresh();

          return;

        }


        const form =
          document.getElementById(
            'overviewForm'
          );


        form.action =
          WEBAPP_URL;


        form.submit();

      },

      7000

    );

}


// =====================================================
// ZRUŠIT ČEKAJÍCÍ REFRESH
// =====================================================

function cancelOverviewRefresh() {

  if (
    overviewRefreshTimer
  ) {

    clearTimeout(
      overviewRefreshTimer
    );


    overviewRefreshTimer =
      null;

  }

}


// =====================================================
// ZMĚNIT KAMERU
// =====================================================

async function changeCamera() {

  cancelOverviewRefresh();


  attendanceMode =
    false;


  testMode =
    true;


  cameraTestSuccessful =
    false;


  scannerBusy =
    false;


  pendingScan =
    false;


  lastCode =
    '';


  lastScanTime =
    0;


  scanner.stop();


  document
    .getElementById(
      'setupControls'
    )
    .style.display =
      'block';


  confirmCameraButton
    .classList
    .remove(
      'visible'
    );


  cameraMessage.className =
    '';


  cameraMessage.textContent =
    'Vyber kameru a spusť nový test.';


  window.scrollTo({

    top: 0,

    behavior: 'smooth'

  });

}


// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


// =====================================================
// TLAČÍTKA
// =====================================================

testCameraButton
  .addEventListener(
    'click',
    startSelectedCamera
  );


confirmCameraButton
  .addEventListener(
    'click',
    confirmCamera
  );


changeCameraButton
  .addEventListener(
    'click',
    changeCamera
  );


// =====================================================
// START
// =====================================================

loadCameras();


</script>
