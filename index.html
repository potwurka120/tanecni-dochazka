<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Test QR kamery</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    select,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }

    select {
      background: white;
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #222;
      color: white;
      font-weight: bold;
    }

    .video-box {
      width: 100%;
      max-width: 340px;
      margin: 15px auto;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #111;
    }

    #qr-video {
      width: 100%;
      display: block;
    }

    #result {
      margin-top: 12px;
      padding: 18px;
      border-radius: 12px;
      background: white;
      text-align: center;
      font-size: 18px;
    }

    .success {
      background: #dff3df !important;
      border: 2px solid #70b970;
    }

    .error {
      background: #ffe5e5 !important;
      border: 2px solid #d66;
    }

    .code {
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>
    📷 Test QR kamery
  </h1>

  <select id="cameraSelect">

    <option value="">
      Načítám kamery...
    </option>

  </select>

  <button onclick="startSelectedCamera()">
    Spustit vybranou kameru
  </button>

  <div class="video-box">

    <video
      id="qr-video"
      playsinline>
    </video>

  </div>

  <div id="result">
    Čekám na kameru.
  </div>

</div>


<script type="module">

import QrScanner
  from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';


const video =
  document.getElementById(
    'qr-video'
  );


const select =
  document.getElementById(
    'cameraSelect'
  );


const result =
  document.getElementById(
    'result'
  );


let scanner =
  null;


// =====================================================
// VYTVOŘENÍ SKENERU
// =====================================================

scanner =
  new QrScanner(

    video,

    function(scanResult) {

      const code =
        String(
          scanResult.data || ''
        )
          .trim()
          .toUpperCase();


      if (!code) {
        return;
      }


      result.className =
        'success';


      result.innerHTML =

        '✅ QR přečten' +

        '<div class="code">' +

        code +

        '</div>';

    },

    {

      returnDetailedScanResult:
        true,

      highlightScanRegion:
        true,

      highlightCodeOutline:
        true,

      maxScansPerSecond:
        15,

      preferredCamera:
        'environment'

    }

  );


// =====================================================
// NAČTENÍ KAMER
// =====================================================

async function loadCameras() {

  try {

    // Nejprve krátce spustíme kameru,
    // aby prohlížeč povolil přístup.

    await scanner.start();


    const cameras =
      await QrScanner.listCameras(
        true
      );


    select.innerHTML =
      '';


    cameras.forEach(

      function(camera, index) {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          camera.id;


        option.textContent =

          (index + 1) +
          '. ' +
          (
            camera.label ||
            'Kamera'
          );


        select.appendChild(
          option
        );

      }

    );


    scanner.stop();


    result.className =
      '';


    result.textContent =
      'Vyber kameru a spusť test.';


  } catch (error) {

    result.className =
      'error';


    result.textContent =
      '❌ ' +
      error;

  }

}


// =====================================================
// SPUSTIT VYBRANOU KAMERU
// =====================================================

window.startSelectedCamera =
  async function() {

    const cameraId =
      select.value;


    if (!cameraId) {

      return;

    }


    try {

      scanner.stop();


      await scanner.setCamera(
        cameraId
      );


      await scanner.start();


      result.className =
        '';


      result.textContent =
        '📷 Kamera běží. Zkus QR kód.';


    } catch (error) {

      result.className =
        'error';


      result.textContent =
        '❌ ' +
        error;

    }

  };


// =====================================================
// START
// =====================================================

loadCameras();

</script>

</body>

</html>
